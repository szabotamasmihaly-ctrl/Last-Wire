<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Verse</title>
<meta name="theme-color" content="#1B1035">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700;800&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
:root{
  --bg:#1B1035; --bg2:#2A1A52; --card:#2F2060; --edge:#47358A; --ink:#FFFFFF; --ink-2:#C9BEF0;
  --pink:#FF4FA3; --pink-d:#C42A78; --cyan:#3DDCFF; --cyan-d:#1A9DBF; --gold:#FFC83D; --gold-d:#D19A12;
  --ok:#2BD67B; --ok-d:#16A35A; --bad:#FF4B55; --bad-d:#C4232D;
  --font:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Big Shoulders Display",Impact,"Arial Narrow Bold",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 70% at 50% -10%,#4A2A8C 0%,var(--bg) 60%) fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:560px;margin:0 auto}
.ib{min-width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px;font-weight:800;padding:0 10px;text-decoration:none;color:inherit}
.ib:active{transform:translateY(2px)}
.brand{flex:1;text-align:center;font-family:var(--display);font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--pink)}
#app{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.center{text-align:center}
.lead{color:var(--ink-2);font-size:16px;margin:6px 0 18px;text-align:center}
h1{font-family:var(--display);font-size:44px;line-height:1;margin:8px 0 4px;text-align:center;text-transform:uppercase;letter-spacing:.02em}
/* the record */
.rec{width:150px;height:150px;margin:6px auto 8px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#111 0 2px,#1d1d1d 2px 4px);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.06)}
.rec:after{content:"";position:absolute;inset:36%;border-radius:50%;background:conic-gradient(var(--pink),var(--gold),var(--cyan),var(--pink));box-shadow:inset 0 0 0 6px rgba(0,0,0,.25)}
.rec:before{content:"";position:absolute;left:48%;top:48%;width:4%;height:4%;border-radius:50%;background:#000;z-index:2}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:4px;justify-content:center;height:26px;align-items:flex-end;margin:0 0 6px}
.eq i{width:6px;border-radius:3px;background:var(--cyan);height:6px}
.eq.on i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.1s;background:var(--pink)}.eq i:nth-child(3){animation-delay:.25s;background:var(--gold)}.eq i:nth-child(4){animation-delay:.05s}.eq i:nth-child(5){animation-delay:.3s;background:var(--pink)}
@keyframes eq{0%,100%{height:6px}50%{height:26px}}
/* mode buttons */
.modes{display:grid;gap:12px;margin-top:10px}
.mode{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--edge);text-align:left;width:100%;animation:pop .35s both}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.mode .mi{font-size:34px;width:48px;text-align:center}
.mode b{display:block;font-size:20px}
.mode span.s{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.mode.solo{box-shadow:0 5px 0 var(--cyan-d);border:2px solid var(--cyan)}
.mode.coop{box-shadow:0 5px 0 var(--ok-d);border:2px solid var(--ok)}
.mode.vs{box-shadow:0 5px 0 var(--pink-d);border:2px solid var(--pink)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
/* big buttons */
.big{display:block;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:19px;background:var(--pink);box-shadow:0 5px 0 var(--pink-d);margin-top:12px;text-align:center}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.big.ghost{background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big.cy{background:var(--cyan);color:#062733;box-shadow:0 5px 0 var(--cyan-d)}
.big:disabled{opacity:.45}
/* room */
.code{display:flex;justify-content:center;gap:8px;margin:14px 0}
.code b{width:58px;height:70px;border-radius:14px;background:#fff;color:var(--bg);font-family:var(--display);font-size:44px;display:grid;place-items:center;box-shadow:0 5px 0 var(--edge);animation:pop .3s both}
.code b:nth-child(2){animation-delay:.05s}.code b:nth-child(3){animation-delay:.1s}.code b:nth-child(4){animation-delay:.15s}
.join{display:flex;gap:10px;margin-top:8px}
.join input{flex:1;min-width:0;height:60px;border-radius:16px;border:3px solid var(--edge);background:#fff;color:var(--bg);font-family:var(--display);font-size:34px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.join input:focus{outline:none;border-color:var(--cyan)}
.join .big{width:auto;margin:0;padding:0 22px}
.or{text-align:center;color:var(--ink-2);margin:20px 0 4px;font-weight:700}
.err{color:var(--bad);text-align:center;min-height:22px;margin-top:6px;font-weight:700}
/* waiting */
.wait{margin:26px auto;text-align:center;padding:22px 16px;border-radius:20px;background:rgba(255,255,255,.07);border:2px dashed var(--edge)}
.wait p{margin:8px 0 0;font-size:19px;font-weight:800}
.dots{display:inline-flex;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink-2);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;font-weight:800}
.hud .pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.d{background:var(--ok)}.pips i.x{background:var(--bad)}.pips i.c{background:var(--gold)}
.hearts{letter-spacing:2px;font-size:18px}
.score{display:flex;gap:10px;font-size:18px}
.score span{padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.1)}
.score .me{color:var(--cyan)}.score .th{color:var(--pink)}
.tbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transform-origin:left;animation:tb linear forwards}
@keyframes tb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.song{text-align:center;color:var(--gold);font-weight:800;font-size:15px;margin:4px 0}
.line{font-size:25px;line-height:1.35;font-weight:700;text-align:center;margin:10px 0 18px;min-height:68px}
.hole{display:inline-block;min-width:90px;border-bottom:4px solid var(--cyan);margin:0 4px;height:1.05em;vertical-align:-2px;animation:blink 1.4s infinite}
@keyframes blink{50%{border-color:var(--pink)}}
.fill{color:var(--ok);display:inline-block;animation:drop .45s cubic-bezier(.2,1.6,.4,1) both}
.fill.bad{color:var(--bad)}
@keyframes drop{from{transform:translateY(-40px) scale(1.4);opacity:0}to{transform:none;opacity:1}}
.opts{display:grid;gap:10px}
.opt{padding:16px;border-radius:18px;font-size:22px;font-weight:800;background:#fff;color:var(--bg);box-shadow:0 5px 0 #B6A9E6;animation:pop .3s both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #B6A9E6}
.opt.no{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-d);animation:shake .4s}
.opt.yes{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.35}
.opts.say .opt{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.play{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 12px;padding:12px 22px;border-radius:999px;background:var(--cyan);color:#062733;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--cyan-d)}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cyan-d)}
.role{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 10px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:800;width:max-content;max-width:100%}
.slot{width:100%;max-width:356px;height:200px;margin:0 auto 12px;border-radius:16px;background:#000 center/cover;position:relative;overflow:hidden;display:grid;place-items:center}
.slot.tts{height:auto;background:none}
#dock{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;border-radius:16px;z-index:5}
#dock.on{width:356px;height:200px}
#dock iframe{width:100%;height:100%;border:0}
/* reveal */
.reveal{position:fixed;inset:0;background:rgba(15,8,34,.82);display:grid;place-items:center;z-index:20;padding:16px;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.rv{max-width:500px;width:100%;text-align:center;background:var(--card);border-radius:24px;padding:22px 18px;border:3px solid var(--edge);animation:pop .3s both}
.rv .big-i{font-size:54px}
.rv .full{font-size:20px;font-weight:700;margin:10px 0}
.rv .full b{color:var(--ok)}
.rv .who{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.rv .who span{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800}
/* end */
.stars{font-size:54px;letter-spacing:6px;text-align:center;margin:10px 0}
.stars i{font-style:normal;color:rgba(255,255,255,.18);display:inline-block}
.stars i.on{color:var(--gold);animation:star .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.final{display:flex;justify-content:center;gap:16px;margin:14px 0;font-family:var(--display);font-size:56px}
.final .me{color:var(--cyan)}.final .th{color:var(--pink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:13px;color:var(--ink-2);text-align:center;margin-top:16px}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>

  return rec(true) + '<p class="lead">' + esc(t('tag')) + '</p><div class="modes">' +
    '<button class="mode solo" data-a="solo"><span class="mi">🎧</span><span><b>' + esc(t('solo')) + '</b><span class="s">' + esc(t('soloS')) + '</span></span></button>' +
    '<button class="mode coop" data-a="room" data-v="coop" style="animation-delay:.06s"><span class="mi">🤝</span><span><b>' + esc(t('coop')) + '</b><span class="s">' + esc(t('coopS')) + '</span></span></button>' +
    '<button class="mode vs" data-a="room" data-v="vs" style="animation-delay:.12s"><span class="mi">⚔️</span><span><b>' + esc(t('vs')) + '</b><span class="s">' + esc(t('vsS')) + '</span></span></button></div>';
}
function vRoom() {
  var icon = S.mode === 'coop' ? '🤝' : '⚔️';
  return '<h1>' + icon + ' ' + esc(t(S.mode)) + '</h1><p class="lead">' + esc(t(S.mode + 'S')) + '</p>' +
    '<button class="big" data-a="make">' + esc(t('make')) + '</button><p class="or">' + esc(t('orj')) + '</p>' +
    '<div class="join"><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="' + esc(t('codeQ')) + '" aria-label="' + esc(t('codeQ')) + '"><button class="big cy" data-a="join">' + esc(t('join')) + '</button></div><div class="err">' + esc(S.err) + '</div>';
}
function vWait() {
  if (S.mode === 'solo') return waitBox(t('wSongs'));
  var D = derive();
  if (D.bye) return waitBox(t('left'));
  if (!D.friend) return S.host ? '<p class="lead">' + esc(t('share')) + '</p>' + waitBox(t('wFriend'), true) : waitBox(t('wFriend'));
  return waitBox(S.host ? t('wSongs') : t('wHostSongs'));
}
function pips(res, n, cur) {
  var h = '<span class="pips">';
  for (var i = 0; i < n; i++) h += '<i class="' + (i < res.length && i < cur ? (res[i] ? 'd' : 'x') : i === cur ? 'c' : '') + '"></i>';
  return h + '</span>';
}
function hearts(n) { var h = ''; for (var i = 0; i < 3; i++) h += i < n ? '❤️' : '🖤'; return '<span class="hearts" aria-label="' + n + '/3">' + h + '</span>'; }
function lineHTML(rd, filled, bad) {
  return '<p class="line" lang="en">' + esc(rd.pre) + (filled ? '<span class="fill' + (bad ? ' bad' : '') + '">' + esc(filled) + '</span>' : '<span class="hole" aria-label="___"></span>') + esc(rd.post) + '</p>';
}
function audioBox(rd) {
  var yt = rd.yt && rd.t0 != null && !rd.ytBad;
  return (yt ? '<div class="slot" data-yt="1"></div>' : '<div class="slot tts">' + rec(false) + '</div><p class="small">' + esc(t('voice')) + '</p>') +
    '<button class="play" data-a="play"><span>▶</span>' + esc(t('play')) + '</button>';
}
function optsHTML(list, wrong, sayOnly) {
  return '<div class="opts' + (sayOnly ? ' say' : '') + '">' + list.map(function (w) {
    var bad = wrong && wrong.indexOf(w) >= 0;
    return '<button class="opt' + (bad ? ' no dim' : '') + '" ' + (sayOnly ? 'tabindex="-1" aria-disabled="true"' : 'data-a="pick" data-v="' + esc(w) + '"') + (bad ? ' disabled' : '') + ' lang="en">' + esc(w) + '</button>';
  }).join('') + '</div>';
}
function songTag(rd) { return '<p class="song">🎵 ' + esc(rd.a ? rd.a + ' – ' + rd.s : rd.s) + '</p>'; }
function timerBar(sec) { var left = Math.max(0.1, sec - (Date.now() - S.roundAt) / 1000); return '<div class="tbar"><i style="animation-duration:' + left + 's"></i></div>'; }
function vGame() {
  if (S.mode === 'solo') {
    var so = S.solo, rd = so.rounds[so.r];
    return '<div class="hud">' + pips(so.res, so.rounds.length, so.r) + hearts(so.hearts) + '</div>' + timerBar(SOLO_TIME) + songTag(rd) + audioBox(rd) + lineHTML(rd) + optsHTML(rd.o, so.wrong);
  }
  var D = derive(), G = D.G; if (!G) return vWait();
  var r = Math.min(S.shown, D.n - 1), rd = G.rounds[r];
  if (D.mode === 'coop') {
    var dj = r % 2 === 0 ? G.h : G.g, res = D.res.map(function (x) { return x.ok; });
    var top = '<div class="hud">' + pips(res, D.n, r) + hearts(D.hearts) + '</div>';
    if (dj === DEV) return top + '<div class="role">🎧 ' + esc(t('listen')) + '</div>' + songTag(rd) + audioBox(rd) + optsHTML(rd.o2, null, true) + '<div class="wait" style="margin-top:14px"><p style="margin:0">' + esc(t('wPick')) + '</p>' + dots() + '</div>';
    return top + '<div class="role">👆 ' + esc(t('pickR')) + '</div>' + songTag(rd) + rec(false) + lineHTML(rd) + optsHTML(rd.o, D.wrong[r]);
  }
  var head = '<div class="hud">' + pips(D.res.slice(0, r).map(function (x) { return x.mine && x.mine.ok; }), D.n, r) + '<span class="score"><span class="me">' + esc(t('you')) + ' ' + D.me + '</span><span class="th">' + esc(t('them')) + ' ' + D.them + '</span></span></div>';
  var mine = D.res[r] && D.res[r].mine;
  if (mine) return head + songTag(rd) + lineHTML(rd, mine.w || '…', !mine.ok) + waitBox(t('wAns'));
  return head + timerBar(VS_TIME) + songTag(rd) + audioBox(rd) + lineHTML(rd) + optsHTML(rd.o);
}
function vReveal() {
  var R = S.reveal; if (!R) return '';
  var rd, ok, extra = '';
  if (R.solo) { rd = S.solo.rounds[R.r]; ok = R.ok; }
  else {
    var D = R.D; rd = D.G.rounds[R.r]; var res = D.res[R.r] || {};
    if (D.mode === 'coop') ok = res.ok;
    else {
      ok = res.mine && res.mine.ok;
      var me = res.mine, th = res.theirs;
      extra = '<div class="who"><span>' + esc(t('you')) + ' ' + (me && me.ok ? '✅' : '❌') + (res.fast === DEV ? ' ⚡' : '') + '</span><span>' + esc(t('them')) + ' ' + (th && th.ok ? '✅' : '❌') + (res.fast && res.fast !== DEV ? ' ⚡' : '') + '</span></div>';
    }
  }
  var full = esc(rd.pre) + '<b>' + esc(rd.w) + '</b>' + esc(rd.post);
  return '<div class="reveal"><div class="rv"><div class="big-i">' + (ok ? '🎉' : R.late ? '⏰' : '💥') + '</div><h1 style="font-size:34px">' + esc(ok ? t('right') : R.late ? t('time') : t('wrong')) + '</h1><p class="full" lang="en">' + full + '</p>' + songTag(rd) + extra + '</div></div>';
}
function stars(n) { var h = '<div class="stars">'; for (var i = 0; i < 3; i++) h += '<i class="' + (i < n ? 'on' : '') + '" style="animation-delay:' + (0.2 + i * 0.18) + 's">★</i>'; return h + '</div>'; }
function vEnd() {
  if (S.mode === 'solo') {
    var so = S.solo, st = so.hearts <= 0 ? 0 : so.hearts;
    return '<h1>' + esc(so.hearts > 0 ? t('done') : t('out')) + '</h1>' + stars(st) + '<div class="final"><span class="me">' + so.score + '/' + so.rounds.length + '</span></div>' +
      '<button class="big" data-a="solo">' + esc(t('again')) + '</button><button class="big ghost" data-a="menu">' + esc(t('home')) + '</button>';
  }
  var D = derive(), h;
  if (D.mode === 'coop') h = '<h1>' + esc(D.over === 'won' ? t('team') : t('out')) + '</h1>' + stars(D.over === 'won' ? D.hearts : 0) + '<div class="final"><span class="me">' + D.res.filter(function (x) { return x.ok; }).length + '/' + D.n + '</span></div>';
  else h = '<h1>' + esc(D.me > D.them ? t('win') : D.me < D.them ? t('lose') : t('draw')) + '</h1><div class="final"><span class="me">' + D.me + '</span><span>:</span><span class="th">' + D.them + '</span></div>';
  if (D.bye) return h + waitBox(t('left')) + '<button class="big ghost" data-a="menu">' + esc(t('home')) + '</button>';
  var asked = D.again[DEV];
  return h + (asked ? waitBox(t('wAgain')) : '<button class="big" data-a="again">' + esc(t('again')) + '</button>') + '<button class="big ghost" data-a="menu">' + esc(t('home')) + '</button>';
}
function render() {
  var app = $('#app'), keep = $('#code'), typed = keep ? keep.value : null;
  var h = S.screen === 'home' ? vHome() : S.screen === 'room' ? vRoom() : S.screen === 'wait' ? vWait() : S.screen === 'game' ? vGame() + vReveal() : S.screen === 'end' ? vEnd() : '';
  if (S.offline && S.screen === 'game' && !S.reveal) h += '<p class="small">' + esc(t('offline')) + '</p>';
  if (app._h !== h) { app.innerHTML = h; app._h = h; var c = $('#code'); if (c && typed != null) c.value = typed; }
  $('#lang').textContent = UI.toUpperCase(); document.documentElement.lang = UI;
  dockTo();
}

/* ---------- taps ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-a'), v = b.getAttribute('data-v');
  if (a === 'solo') { leaveNet(); startSolo(); return; }
  if (a === 'room') { S.mode = v; S.err = ''; S.screen = 'room'; render(); return; }
  if (a === 'make') {
    var c = ''; for (var i = 0; i < 4; i++) c += ABC[rnd(ABC.length)];
    S.room = c; S.host = true; S.ev = []; S.gid = ''; S.screen = 'wait';
    fetch(dbUrl(topic(c)), { method: 'DELETE' }).catch(function () {}).then(function () { listen(); post({ k: 'open' }); post({ k: 'hi' }); });
    render(); return;
  }
  if (a === 'join') {
    var inp = $('#code'), code = String(inp && inp.value || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (code.length !== 4 || code.split('').some(function (ch) { return ABC.indexOf(ch) < 0; })) { S.err = t('badCode'); beep('no'); render(); return; }
    S.room = code; S.host = false; S.ev = []; S.gid = ''; S.err = ''; S.screen = 'wait'; listen(); post({ k: 'hi' }); render(); return;
  }
  if (a === 'play') {
    if (S.mode === 'solo') playRound(S.solo.rounds[S.solo.r]);
    else { var D = derive(); if (D.G) playRound(D.G.rounds[Math.min(S.shown, D.n - 1)]); }
    return;
  }
  if (a === 'pick') {
    if (S.reveal) return;
    if (S.mode === 'solo') { soloPick(v); return; }
    var D2 = derive(), G = D2.G; if (!G || D2.cur !== S.shown) return;
    var rd = G.rounds[D2.cur], ok = v === rd.w;
    if (D2.mode === 'coop') { if (!ok) beep('no'); post({ k: 'ans', gid: G.gid, r: D2.cur, w: v, ok: ok }); }
    else { if (D2.mineNow) return; stopAudio(); post({ k: 'ans', gid: G.gid, r: D2.cur, w: v, ok: ok, ms: Date.now() - S.roundAt }); }
    return;
  }
  if (a === 'again') { post({ k: 'again' }); render(); return; }
  if (a === 'menu') { leaveNet(); S.screen = 'home'; S.mode = ''; render(); return; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'code') { var j = document.querySelector('[data-a="join"]'); if (j) j.click(); } });
$('#lang').onclick = function () { UI = UIL[(UIL.indexOf(UI) + 1) % UIL.length]; try { localStorage.setItem('lv-ui', UI); } catch (e) {} render(); };
$('#home').onclick = function (e) { if (S.screen !== 'home') { e.preventDefault(); leaveNet(); S.screen = 'home'; S.mode = ''; render(); } };
function leaveNet() {
  clearLater(); stopAudio();
  if (S.room && Link.es) post({ k: 'bye' });
  linkStop(); S.room = ''; S.host = false; S.ev = []; S.gid = ''; S.reveal = null; S.building = false;
}
/* versus: a phone that has not answered in time sends an empty answer, so both phones move on */
setInterval(function () {
  if (S.screen !== 'game' || S.mode !== 'vs' || S.reveal) return;
  var D = derive(); if (!D.G || D.cur !== S.shown || D.mineNow) return;
  if (Date.now() - S.roundAt > VS_TIME * 1000) { stopAudio(); post({ k: 'ans', gid: D.G.gid, r: D.cur, w: '', ok: false, ms: VS_TIME * 1000 }); }
}, 500);
render();
if ('speechSynthesis' in window) try { speechSynthesis.getVoices(); } catch (e) {}
</script>
</body>
</html>
