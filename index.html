<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utolsó drót – tanulj magyarul</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F3FA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&display=swap">
<style>
:root{
  /* Layout: one page, two worlds. Red enamel hardware is the bomb; white paper is the manual.
     Everything is left-aligned; stencil lettering belongs to the hardware and to chapter titles. */
  --enamel:#C4122F; --enamel-deep:#8D0B21; --face1:#D51C3A; --face2:#BE122E; --face3:#A60E27; --side1:#B4112C; --side2:#8D0B21;
  --graphite:#1E2329; --graphite-2:#2A3138; --pit:#0E1114;
  --paper:#F7F7F2; --paper-2:#E8E8E0; --ink:#15181C; --ink-2:#565C63;
  --signal:#FFC83D; --signal-deep:#B98C12; --ok:#3DDC84; --bad:#FF5B61;
  --chalk:#F1F1EC;
  --font-display:"Big Shoulders Stencil","Big Shoulders Stencil Display",Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;
  --font-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --gut:clamp(16px,4vw,40px);
  color-scheme:light;
}
/* the bomb takes the colour of the language being practised: Danish red, English blue, Hungarian green */
html[data-tl="en"]{--enamel:#1F4DB8;--enamel-deep:#132F78;--face1:#2A5BD0;--face2:#1F4DB8;--face3:#1A3F9A;--side1:#1B44A6;--side2:#132F78}
html[data-tl="hu"]{--enamel:#1E7A46;--enamel-deep:#12532E;--face1:#27935A;--face2:#1E7A46;--face3:#18663A;--side1:#1B6E40;--side2:#12532E}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--enamel);color:#fff;font:16px/1.5 var(--font-body);overflow-x:hidden}
body[data-view="paper"]{background:var(--paper);color:var(--ink)}
p,h1,h2,h3,ul,ol,dl,dd,figure,fieldset{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
body[data-view="paper"] :focus-visible,.side.soft :focus-visible,.drawer :focus-visible{outline-color:var(--enamel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* English help: small second line under the Danish, shown only when help is on */
.en{display:none;font-size:.86em;line-height:1.4;opacity:.8;font-weight:400}
.help-on .en{display:block}
.gl{display:block;font-size:.86em;line-height:1.4;opacity:.72}
.pp{display:grid;gap:3px;min-width:0}
[data-fit]{min-width:0;max-width:100%}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:10px var(--gut);min-height:56px}
.brand{font:800 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;background:none;border:0;padding:8px 0}
[data-screen="home"] .brand{visibility:hidden}
.bar-sp{flex:1}
.bar-b{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:40px;white-space:nowrap}
.bar-b.tog[aria-pressed="true"]{background:#fff;color:var(--enamel);border-color:#fff}
[data-view="paper"] .bar-b.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.brand{white-space:nowrap}
@media (max-width:560px){.brand{display:none}}
@media (max-width:400px){.bar{gap:6px}.bar-b{padding:7px 10px;font-size:13px}.bar-b .wide{display:none}}

/* ---------- home ---------- */
.home-head{padding:4px var(--gut) 26px;display:grid;gap:12px}
.title{font:900 clamp(58px,14vw,150px)/.84 var(--font-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.region{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--font-display);text-transform:uppercase;letter-spacing:.08em}
.region b{background:#fff;color:var(--enamel);padding:5px 9px 4px;border-radius:3px}
.premise{max-width:54ch;font-size:19px;line-height:1.45}
.jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.jump .hb{flex:1 1 150px}
.split{display:grid;grid-template-columns:minmax(0,1fr)}
.side{padding:22px var(--gut) 28px;display:grid;gap:16px;align-content:start;min-width:0}
.side h2,.howto h2{font:800 clamp(30px,5vw,40px)/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.side.soft{background:var(--paper);color:var(--ink)}
@media (min-width:940px){
  .split{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start;gap:0 34px;padding:0 var(--gut)}
  .side.hard{padding-left:0;padding-right:0}
  .side.soft{padding:26px 28px 30px;transform:rotate(.6deg);border-radius:3px;box-shadow:0 22px 44px -20px rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.18);position:sticky;top:18px}
  .jump{display:none}
}
.field{display:grid;gap:8px}
.field.two{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end}
.flabel{font-weight:700;font-size:15px;display:block}
.mis-list{display:grid;gap:8px}
.mis{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:rgba(0,0,0,.2);color:#fff;border:2px solid transparent;border-radius:10px;padding:9px 14px 9px 10px;min-height:64px}
.mis:hover{background:rgba(0,0,0,.3)}
.mis.on{background:#fff;color:var(--ink);border-color:#fff}
.mis-n{font:900 40px/1 var(--font-display);text-align:center}
.mis.on .mis-n{color:var(--enamel)}
.mis-b{display:grid;gap:1px;min-width:0}
.mis-b b{font-size:17px}
.mis-p{font-size:14px;opacity:.9}
.mis-m{font-size:13px;opacity:.78}
.mis-s{font-size:16px;letter-spacing:2px;white-space:nowrap}
.seg3{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid #fff;border-radius:10px;overflow:hidden;margin-top:8px}
.seg3 button{background:transparent;color:#fff;border:0;padding:7px 16px;min-height:48px;font-weight:700;display:grid;justify-items:center;line-height:1.2}
.seg3 button small{font-weight:500;font-size:12px;opacity:.9}
.seg3 button[aria-pressed="true"]{background:#fff;color:var(--enamel)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.check input,.radio-l input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:#fff}
.check.ink input,.radio-l input{accent-color:var(--enamel)}
.ctas{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.cta{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--signal);color:#1b1500;border:0;border-radius:12px;padding:13px 22px 12px;font-weight:700;font-size:19px;line-height:1.25;box-shadow:0 4px 0 var(--signal-deep),0 12px 20px -10px rgba(0,0,0,.55);min-height:54px}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--signal-deep)}
.cta .en{font-size:13px;font-weight:500;opacity:.85}
.cta.ink{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 #000,0 12px 20px -12px rgba(0,0,0,.5)}
.cta.ink:active{box-shadow:0 1px 0 #000}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:10px 0;font-weight:600;text-align:left;min-height:44px}
.code-in{font:800 44px/1 var(--font-display);letter-spacing:.1em;width:100%;max-width:290px;padding:12px 14px 8px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.code-in::placeholder{color:#c3c6c0}
.err{color:#A80F26;font-weight:600;min-height:1.5em}
.vstat{font-size:14.5px;color:var(--ink-2);display:grid;gap:10px}
.vstat .pbtn{color:var(--ink);font-size:16px}
.pbtn{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:9px;padding:8px 14px;min-height:44px;font-weight:700;justify-self:start;text-align:left}
.pbtn:active{transform:translateY(1px)}
.howto{padding:34px var(--gut) 48px;display:grid;gap:16px;max-width:1180px}
.howto ol{display:grid;gap:18px 28px;counter-reset:s;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.howto li{counter-increment:s;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.howto li::before{content:counter(s);font:900 52px/.85 var(--font-display)}
.howto-note{max-width:70ch}
.howto-note{font-weight:600}

/* ---------- briefing ---------- */
.brief{padding:6px var(--gut) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:860px}
.eyebrow{font-weight:600;opacity:.92}
.brief h1,.result h1{font:900 clamp(44px,9vw,84px)/.88 var(--font-display);text-transform:uppercase;text-wrap:balance}
.grid-gap{display:grid;gap:10px}
.codeplates{display:flex;gap:10px;flex-wrap:wrap}
.cp{background:var(--pit);border-radius:10px;padding:14px 16px 10px;display:grid;gap:6px;justify-items:center;min-width:112px;flex:1 1 0;max-width:190px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.cp b{font:900 clamp(52px,13vw,72px)/.85 var(--font-display);color:var(--signal);letter-spacing:.05em}
.cp span{font-size:14px;color:var(--chalk)}
.modlist{display:grid;gap:6px}
.modlist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 12px}
.modlist b{font-size:17px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 8px;color:rgba(255,255,255,.88);white-space:nowrap}

/* ---------- game screen: one fixed-height stage with the bomb in it ---------- */
body[data-screen="bomb"]{height:100%;overflow:hidden;background:#0d1013;color:#fff}
body[data-screen="bomb"] #app{height:100%;display:flex;flex-direction:column}
body[data-screen="bomb"] #main{flex:1;min-height:0;display:flex;flex-direction:column}
body[data-screen="bomb"] .bar{flex:none;min-height:46px;padding-top:4px;padding-bottom:4px;background:var(--enamel);color:#fff}
body[data-screen="bomb"] .bar-b{min-height:36px;padding:5px 12px}
body[data-screen="bomb"] .bar-b.tog[aria-pressed="true"]{background:#fff;color:var(--enamel);border-color:#fff}
body[data-screen="bomb"] :focus-visible{outline-color:var(--signal)}
.game{flex:1;min-height:0;display:flex;flex-direction:column;background:#0d1013;color:#fff}
.hud{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:6px var(--gut);background:var(--enamel-deep);color:#fff}
.hud-l{display:grid;font-size:13px;line-height:1.25;min-width:0}
.hud-l b{font:800 30px/1 var(--font-display);letter-spacing:.16em;white-space:nowrap}
.hud-m{position:relative;display:grid;justify-items:center;gap:1px}
.hud-m .lbl{font-size:11px}
.hud-r{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.lbl{font-size:12px;font-weight:600;opacity:.88}
.segs{display:inline-flex;align-items:center;gap:3px;background:#140406;padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.seg7{width:19px;height:32px;display:block}
.seg7 polygon{fill:rgba(255,200,61,.13)}
.seg7 polygon.on{fill:var(--signal)}
.colon{font-size:20px;width:.3em;height:1em;background:radial-gradient(circle at 50% 24%,var(--signal) 0 .11em,transparent .135em),radial-gradient(circle at 50% 76%,var(--signal) 0 .11em,transparent .135em)}
.game.low .seg7 polygon.on{fill:var(--bad)}
.game.low .colon{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.lamps{display:inline-flex;gap:6px;align-items:center}
.lamp{width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
.lamp.on{background:var(--signal);box-shadow:0 0 12px var(--signal)}
.hb{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.65);color:#fff;border-radius:8px;padding:6px 12px;min-height:38px;font-weight:600}
.hb.big{min-height:54px;padding:10px 18px;font-size:17px;border-radius:12px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;background:#14181c}
.man-scroll{flex:1;min-height:0;overflow-y:auto;background:var(--paper)}
.man-scroll .paper-wrap{padding-bottom:24px;min-height:100%}
.toolbar{flex:none;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 10px;background:#07090b}
.tb{background:#1b2026;border:1.5px solid #4a535c;color:#fff;border-radius:8px;padding:7px 13px;min-height:42px;font-weight:700;font-size:15px}
.tb:disabled{opacity:.4}
.tb.on{background:var(--signal);color:#1b1500;border-color:var(--signal)}
.tb-q{font-weight:700;margin-right:6px}
@media (max-width:430px){.tb{padding:7px 9px;font-size:14px}.tb .wide{display:none}}
.caption{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px var(--gut) 8px;background:linear-gradient(rgba(7,9,11,0),rgba(7,9,11,.96) 16px);font-size:14.5px;line-height:1.35;pointer-events:none}
.caption:empty{display:none}
.caption .pp{max-width:76ch;margin:0 auto}
.caption p.big{font-size:17px;font-weight:600;line-height:1.45}
.codechip{display:inline-block;background:var(--signal);color:#1b1500;font:800 1.55em/1 var(--font-display);letter-spacing:.16em;padding:5px 6px 2px 10px;border-radius:6px;vertical-align:-4px}
.caption .keys{opacity:.68;font-size:13px}
@media (pointer:coarse){.caption .keys{display:none}}
.paused{position:absolute;inset:0;display:grid;align-content:center;justify-items:start;gap:18px;padding:var(--gut);font-size:19px}

/* the room */
.scene-bg{position:absolute;inset:0;background:radial-gradient(ellipse 75% 62% at 50% 40%,#3c4650 0,#1e242a 58%,#0d1013 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#171c21,#0a0c0e);box-shadow:0 -1px 0 rgba(255,255,255,.07)}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4);animation:drift 12s linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.6}100%{transform:translate(46px,-130px);opacity:0}}
.shadow{position:absolute;height:34px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(14px);transition:opacity .4s}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,60,0) 35%,rgba(255,40,40,.78) 100%)}

/* the bomb: camera > shake rig > idle float > box of six faces */
.persp{position:absolute;inset:0;perspective:2600px;overflow:hidden;overflow:clip}
.cam,.rig,.float,.bomb{transform-style:preserve-3d}
.cam,.rig,.float{position:absolute;left:0;top:0;width:0;height:0}
.cam{transition:transform .65s cubic-bezier(.3,.75,.25,1)}
.float{animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(-9px) rotateY(-2.6deg) rotateX(.9deg)}50%{transform:translateY(9px) rotateY(2.6deg) rotateX(-.9deg)}}
.stage.zoomed .float{animation:none}
.bomb{position:absolute;transition:transform .95s cubic-bezier(.5,.05,.2,1)}
.stage.intro .bomb,.stage.intro .cam{transition-duration:1.35s}
.stage.no-anim .cam,.stage.no-anim .bomb{transition:none}
.stage.hit .rig{animation:shake .45s linear}
.stage.hit .vignette{animation:vig .52s ease-out}
@keyframes vig{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-10px,-6px)}80%{transform:translate(8px,10px)}}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:6px;background:linear-gradient(155deg,var(--face1) 0,var(--face2) 55%,var(--face3) 100%);box-shadow:inset 0 0 0 5px rgba(0,0,0,.24),inset 0 0 0 12px rgba(255,255,255,.07)}
.face.left,.face.right,.face.top,.face.bottom{background:linear-gradient(155deg,var(--side1),var(--side2))}
.band{position:absolute;left:30px;right:30px;top:30px;height:78px;display:flex;align-items:center;gap:20px;overflow:hidden;font:900 48px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:#F7E9CC;white-space:nowrap}
.band .danger{background:var(--signal);color:#1b1500;padding:9px 14px 4px;border-radius:4px;font-size:42px}
.band b{min-width:0;overflow:hidden}
.band .side{margin-left:auto;font-size:32px;border:3px solid currentColor;padding:8px 12px 4px;border-radius:4px}
.face .stripe{position:absolute;left:50%;top:8%;bottom:8%;width:54px;margin-left:-27px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--signal) 0 30px,#14171B 30px 60px)}
.thisway{position:absolute;left:0;right:0;top:50%;margin-top:-34px;text-align:center;font:900 68px/1 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:rgba(0,0,0,.3)}
.handle{position:absolute;top:-92px;width:240px;height:104px;border:26px solid #9aa3ab;border-bottom:0;border-radius:90px 90px 0 0;box-shadow:inset 0 7px 0 rgba(255,255,255,.35),0 -3px 0 rgba(0,0,0,.35)}
.beacon{flex:none;width:18px;height:18px;border-radius:50%;background:#ff4040;box-shadow:0 0 14px #ff4040;animation:blink 1s steps(2) infinite}
.face.top .beacon{position:absolute;right:70px;top:50%;margin-top:-24px;width:48px;height:48px}
.stage.safe .beacon{animation:none;background:var(--ok);box-shadow:0 0 18px var(--ok)}
.stage.safe .segs .seg7 polygon.on{fill:var(--ok)}
.idplate{position:absolute;left:30px;right:30px;top:120px;bottom:28px;display:flex;flex-wrap:wrap;gap:12px 48px;align-items:center;align-content:center;padding:8px 34px;border-radius:10px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 3px rgba(255,255,255,.26)}
.idc{display:grid;gap:6px}
.idc .lbl{font-size:23px;opacity:.92}
.serial{font:800 56px/1 var(--font-display);letter-spacing:.07em;white-space:nowrap}
.bats{display:inline-flex;gap:12px;align-items:center;height:56px}
.bat{width:28px;height:52px;border-radius:6px;background:linear-gradient(#ecece5 0 24%,#16191d 24%);box-shadow:0 0 0 2px rgba(0,0,0,.45)}

/* panels on the bomb */
.panel{position:absolute;width:400px;height:480px;border-radius:12px}
.panel.blank{display:grid;place-items:center;background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 4px rgba(0,0,0,.2)}
.panel.blank span{font:900 120px/1 var(--font-display);color:rgba(0,0,0,.2)}
.panel.mod,.panel.timerp{color:var(--chalk);background:radial-gradient(circle at 12px 12px,#737b83 0 3px,transparent 3.6px),radial-gradient(circle at calc(100% - 12px) 12px,#737b83 0 3px,transparent 3.6px),radial-gradient(circle at 12px calc(100% - 12px),#737b83 0 3px,transparent 3.6px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#737b83 0 3px,transparent 3.6px),linear-gradient(180deg,var(--graphite-2),var(--graphite));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 5px rgba(0,0,0,.3)}
.panel.mod:focus{outline:none}
.panel.mod.focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 5px var(--signal)}
.panel.mod.solved{background:radial-gradient(circle at 12px 12px,#737b83 0 3px,transparent 3.6px),radial-gradient(circle at calc(100% - 12px) 12px,#737b83 0 3px,transparent 3.6px),linear-gradient(180deg,#1f2a25,#17201c)}
.p-h{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:10px;padding:6px 22px 0}
.p-h h3{flex:1;min-width:0;font:800 27px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-b{position:absolute;left:0;right:0;top:54px;bottom:0;padding:4px 16px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;font-size:17px;line-height:1.4}
.led{flex:none;width:17px;height:17px;border-radius:50%;background:#ff4040;box-shadow:0 0 10px rgba(255,64,64,.8),inset 0 0 0 2px rgba(0,0,0,.3)}
.panel.locked .led{background:#4b1119;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.panel.solved .led{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.guard{position:absolute;inset:0;z-index:3;background:transparent;border:0;border-radius:12px;cursor:zoom-in}
.guard:hover{box-shadow:inset 0 0 0 7px var(--signal)}
.guard:focus-visible{outline:9px solid var(--signal);outline-offset:0}
.timerp .p-b{align-items:center;justify-content:center;gap:30px}
.segs.big{padding:18px 20px;gap:8px;border-radius:12px}
.segs.big .seg7{width:60px;height:100px}
.segs.big .colon{font-size:62px}
.tl{display:flex;align-items:center;gap:18px}
.tl .lbl{font:800 28px/1 var(--font-display);text-transform:uppercase;letter-spacing:.06em;opacity:1}
.lamps.big{gap:16px}
.lamps.big .lamp{width:44px;height:44px}

/* controls inside a panel */
.note{flex:none;font-weight:700;font-size:15px;color:var(--signal)}
.okline{flex:none;font:800 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.donebox{overflow:hidden;font-size:15.5px;min-height:0}
.lockmsg{font-size:17px}
.row{flex:none;display:flex;gap:8px;align-items:center}
.row .slot{flex:1 1 0;width:auto;min-width:0}
.row .go:last-child{margin-left:auto}
.key{background:#E9EAE4;color:#14171B;border:0;border-radius:9px;padding:10px 16px;min-height:46px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #8C9194,0 7px 10px -5px rgba(0,0,0,.65)}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8C9194}
.key.go{background:var(--signal);color:#1b1500;box-shadow:0 3px 0 var(--signal-deep),0 7px 10px -5px rgba(0,0,0,.65)}
.key.go:active:not(:disabled){box-shadow:0 1px 0 var(--signal-deep)}
.key.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.key.sm{font-size:14px}
.key.wide{flex:1}
.key:disabled{opacity:.4}
.key.sq{padding:0;width:46px;font-size:22px;line-height:1}
.key.big{flex:1;min-height:86px;font-size:40px;line-height:1}
.aeoa{display:inline-flex;gap:6px}
.slot{flex:none;width:100%;background:var(--pit);color:#fff;border:2px solid #56606A;border-radius:9px;padding:11px 13px;font:500 19px/1.35 var(--font-body);min-height:52px}
textarea.slot{height:100px;resize:none;display:block}
.slot::placeholder{color:#7d868e}
.slot:focus{border-color:var(--signal)}
.fb{font-weight:600;font-size:16px}
.fb.bad{color:#FFA3A7}
.words{font-size:17px;display:flex;flex-wrap:wrap;gap:2px 8px}
.words .bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.skel{flex:none;display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center}
.sk-w{display:inline-flex;gap:3px}
.sk-w i{width:9px;height:9px;border-radius:50%;background:#77818a}
.sk-p{margin-left:-10px;color:#77818a;font-weight:700}
.learn{display:grid;gap:7px;font-size:16.5px}
.learn.pics{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.learn.pics li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.learn.pics .pic{grid-row:span 2;font-size:26px}
.donebox .learn{font-size:15px;gap:5px}
.learned{font-size:16px}

.plate-steel{flex:none;background:linear-gradient(180deg,#D5DADE,#B3BAC0);border-radius:8px;padding:6px 4px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.wires{display:block;width:100%;height:auto}
.wire[data-a]{cursor:pointer}
.w-hit{stroke:transparent;stroke-width:32;fill:none}
.w-out{stroke:rgba(9,11,14,.8);stroke-width:13;fill:none;stroke-linecap:round}
.w-col{stroke-width:9.5;fill:none;stroke-linecap:round}
.w-hi{stroke:rgba(255,255,255,.38);stroke-width:2;fill:none;stroke-linecap:round;transform:translateY(-2.6px)}
.w-term{fill:#59616A;stroke:#1b1e22;stroke-width:2}
.w-mark{fill:var(--enamel);stroke:#fff;stroke-width:1.5}
.wire.sel .w-out{stroke:#050608;stroke-width:20}
.wire:focus{outline:none}
.wire:focus-visible .w-out{stroke:#050608;stroke-width:17}

.memo-grid{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 186px;gap:10px}
.memo-scr{background:var(--pit);border:2px solid #39424b;border-radius:10px;display:grid;place-items:center;align-content:center;gap:4px;padding:8px;min-width:0;text-align:center}
.memo-pic{font-size:62px;line-height:1.15}
.memo-w{font-size:19px;font-weight:600}
.memo-hint{color:#8c959d;font-size:15px}
.pips{display:flex;gap:6px}
.pips i{width:10px;height:10px;border-radius:50%;background:#39424b}
.pips i.on{background:var(--signal)}
.memo-code{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.memo-code b{min-width:34px;height:44px;border-bottom:3px solid #77818a;font:800 34px/44px var(--font-display);text-align:center;color:var(--signal);letter-spacing:.03em}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pad .key{padding:0;min-height:44px}

.clock-wrap{flex:none;display:flex;gap:14px;align-items:center}
.clock{width:158px;height:158px;flex:none}
.c-rim{fill:#0B0D10}
.c-face{fill:#F6F6F0}
.c-t1{stroke:#9aa0a4;stroke-width:1.2}
.c-t5{stroke:#15181C;stroke-width:3}
.c-n{font:700 17px var(--font-body);fill:#15181C}
.c-hh{stroke:#15181C;stroke-width:7;stroke-linecap:round}
.c-mh{stroke:var(--enamel);stroke-width:4.5;stroke-linecap:round}
.c-cap{fill:#15181C}
.steps{display:grid;gap:7px;flex:1;min-width:0}
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:3px 6px;align-items:center}
.st-l{grid-column:1/-1;font-weight:600;font-size:14.5px;line-height:1.15}
.st-l small{margin-left:6px;font-weight:400;opacity:.75;font-size:12.5px}
.stepper b{font:800 30px/1 var(--font-display);text-align:center;color:var(--signal)}
.digital{justify-self:start;font:800 26px/1 var(--font-display);color:var(--signal);letter-spacing:.06em;background:var(--pit);border-radius:6px;padding:7px 11px 5px}

.bigword{flex:none;font-size:46px;font-weight:700;line-height:1.1;text-align:center;padding:16px 0 12px;overflow-wrap:anywhere}
.lever{flex:none;display:flex;gap:12px}
.minis{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:15.5px}
.minis li{padding:3px 10px;border-radius:999px;background:#151A1E;border:1.5px solid #3b444d}
.minis li.ok{border-color:var(--ok)}
.minis li.no{border-color:var(--bad)}

.gapline{font-size:20px;line-height:1.45}
.gap{display:inline-block;width:66px;border-bottom:3px solid var(--signal);margin:0 5px;transform:translateY(2px)}
.inf{color:#B9C0C6;font-size:16px;white-space:nowrap}

.base{font-size:18px;font-weight:600;line-height:1.35}
.build{flex:none;height:94px;overflow-y:auto;background:var(--pit);border:2px dashed #56606A;border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;align-content:flex-start}
.build-empty{color:#8c959d;font-size:14.5px;padding:4px 6px}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:#E9EAE4;color:#14171B;border:0;border-radius:8px;padding:5px 10px;min-height:36px;min-width:36px;font-weight:600;font-size:16px;box-shadow:0 3px 0 #8C9194}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #8C9194}
.tile.in{background:#fff;box-shadow:0 3px 0 var(--signal-deep)}
.tile.ghost{display:inline-flex;align-items:center;background:transparent;color:transparent;box-shadow:inset 0 0 0 2px #3b444d}
.join{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.join .tile,.join .hole{width:100%;min-height:46px}
.plus{font:800 30px/1 var(--font-display);color:var(--signal)}
.hole{display:block;border:2px dashed #56606A;border-radius:8px}
.tray.two{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tray-col{display:grid;gap:6px;align-content:start}
.tray-col .tile{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis}
.tray-l{font-size:13px;color:#B9C0C6}

.qtext{font-size:18.5px;font-weight:600;line-height:1.3}
.opts{flex:none;display:grid;gap:7px}
.opt{text-align:left;background:#151A1E;color:#fff;border:2px solid #56606A;border-radius:9px;padding:7px 12px;min-height:44px;font-size:16px;line-height:1.25}
.opt.on{background:var(--signal);color:#1b1500;border-color:var(--signal);font-weight:600}

/* ---------- manual (paper) ---------- */
.paper-wrap{background:var(--paper);color:var(--ink);padding-bottom:90px}
.manual{max-width:820px;margin:0 auto;padding:14px var(--gut) 24px;display:grid;gap:16px}
.man-h{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:end;border-bottom:5px double var(--enamel);padding-bottom:12px}
.man-t{display:grid;gap:4px;min-width:0}
.man-h h1{font:900 clamp(48px,11vw,84px)/.84 var(--font-display);text-transform:uppercase}
.man-sub{color:var(--ink-2);font-weight:500}
.stamp{position:absolute;right:0;top:4px;transform:rotate(-4deg);border:2.5px solid var(--enamel);color:var(--enamel);font:800 15px/1 var(--font-display);text-transform:uppercase;letter-spacing:.1em;padding:6px 9px 4px;border-radius:4px;white-space:nowrap}
.man-code{display:grid;justify-items:end}
@media (max-width:560px){.man-h{grid-template-columns:minmax(0,1fr)}.man-code{justify-items:start}.stamp{position:static;justify-self:start}}
.man-code b{font:800 32px/1 var(--font-display);letter-spacing:.08em;white-space:nowrap}
.man-tip{color:var(--ink-2)}
.warm{max-width:640px;margin:0 auto;padding:22px var(--gut) 40px;display:grid;gap:22px}
.warm-words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ww{display:grid;justify-items:center;gap:6px;text-align:center;background:#fff;border:2px solid var(--ink);border-bottom-width:5px;border-radius:16px;padding:16px 10px 12px;animation:warmin .45s cubic-bezier(.2,1.4,.4,1) both}
.ww b{font-size:22px;line-height:1.2;word-break:break-word}
.ww span{color:var(--enamel);font-weight:700}
.warm-sents{display:grid;gap:0;background:#fff;border:1.5px solid rgba(21,24,28,.2);border-radius:14px;padding:4px 16px}
.warm-sents li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(21,24,28,.12);animation:warmin .45s both}
.warm-sents li:last-child{border-bottom:0}
.warm-sents li>span{display:grid;gap:2px}
.ws{font-size:19px;font-weight:600}
.wg{color:var(--ink-2)}
.warm-go{justify-self:stretch;align-items:center;text-align:center;font-size:20px}
@keyframes warmin{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}
@media (max-width:520px){.warm-words{grid-template-columns:minmax(0,1fr)}.ww{grid-template-columns:minmax(0,1fr) auto;justify-items:start;text-align:left;align-items:center}.ww span{grid-column:1}.ww .say,.ww button{grid-row:1/3;grid-column:2}}
@media (prefers-reduced-motion:reduce){.ww,.warm-sents li{animation:none}}
.dsents{display:grid;gap:12px;max-width:520px}
.dsents li{display:flex;align-items:center;gap:12px;background:var(--graphite);color:#fff;border-radius:14px;padding:14px 16px}
.dsents b{font:800 28px/1 var(--font-display);min-width:1.2em}
.dsents .shown{font-size:20px;font-weight:600}
.cpic{display:flex;align-items:center;gap:12px;font-size:48px;line-height:1}
.cpic i{font-style:normal;font-size:30px;font-weight:800;color:var(--signal)}
.cpic span{animation:wdpop .45s cubic-bezier(.2,1.6,.4,1) both}
.cpic span:nth-of-type(2){animation-delay:.12s}.cpic span:nth-of-type(3){animation-delay:.3s}
.tsteps{display:flex;gap:6px;margin:4px 0 14px}
.tsteps i{flex:1;height:8px;border-radius:99px;background:var(--paper-2);transition:background .4s}
.tsteps i.done{background:var(--ok)}
.tsteps i.on{background:var(--enamel)}
.tnav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.tnav .tnext{margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 3px 0;margin:0 -3px;scrollbar-width:thin}
.tab{flex:1 0 132px;display:grid;justify-items:start;align-content:center;gap:1px;text-align:left;background:var(--paper-2);color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:9px 14px;min-height:46px;font-weight:700}
.tab.on{background:var(--ink);color:var(--paper)}
.chapter{display:grid;gap:14px;border-top:3px solid var(--ink);padding-top:18px;margin-top:-16px;min-width:0}
.chapter h2{font:800 38px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.chapter>.pp{max-width:64ch;font-size:17px}
.chapter>p.en{font-size:15px;max-width:64ch}
.rules{display:grid;gap:9px;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:19px;line-height:1.4;padding:10px 14px 10px 10px;background:#fff;border:1.5px solid rgba(21,24,28,.2);border-radius:8px}
.rules li::before{content:counter(r);font:900 30px/1 var(--font-display);color:var(--enamel);text-align:center}
.rules li.else{counter-increment:none}
.rules li.else::before{content:"\2192"}
.gloss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 16px;font-size:14.5px;color:var(--ink-2);opacity:1}
.help-on .gloss.en{display:grid}
.gloss dt{font-weight:700;color:var(--ink)}
.tbl-wrap{overflow-x:auto;background:#fff;border:1.5px solid rgba(21,24,28,.2);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:17.5px}
.tbl th,.tbl td{padding:9px 14px;text-align:left;border-bottom:1px solid rgba(21,24,28,.14);vertical-align:top}
.tbl th{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl.nums td:last-child{font:800 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--enamel);letter-spacing:.04em}
.tbl.verbs td{white-space:nowrap}
@media (max-width:520px){.tbl.verbs{font-size:15.5px}.tbl.verbs td{white-space:normal}.tbl th,.tbl td{padding:9px 10px}.tbl.verbs th,.tbl.verbs td{padding:8px 7px}}
.notice{background:#fff;border:1.5px solid rgba(21,24,28,.22);border-radius:3px;padding:18px 20px 20px;font-size:19px;line-height:1.55;box-shadow:4px 5px 0 rgba(21,24,28,.13);max-width:62ch;display:grid;gap:8px}
.kind{font-size:13.5px;color:var(--enamel);font-weight:700}
.radio{background:var(--graphite);color:#fff;border-radius:12px;padding:14px 16px 16px;display:grid;gap:10px;max-width:560px}
.radio-h{display:flex;gap:12px;align-items:center;font-size:18px}
.onair{color:var(--signal);font-weight:700;font-size:14px}
.radio-text{background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:20px;font-weight:500}
.warn{font-weight:700;color:#A80F26}
.tip,.tipline{font-weight:600}
.man-foot{max-width:820px;margin:0 auto;padding:0 var(--gut)}

/* ---------- result ---------- */
.result{padding:6px var(--gut) 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:900px}
.result h1{font-size:clamp(64px,17vw,180px);line-height:.9;margin:6px 0 10px}
.lead{font-size:20px;max-width:46ch}
.stats{display:flex;gap:14px 30px;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font:800 40px/1 var(--font-display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.recap{background:var(--paper);color:var(--ink);border-radius:4px;padding:22px 22px 24px;display:grid;gap:16px;box-shadow:0 18px 36px -20px rgba(0,0,0,.6)}
.recap h2{font:800 34px/1 var(--font-display);text-transform:uppercase}
.recap h3{font-size:14px;font-weight:700;color:var(--enamel);margin-bottom:6px}
.recap .learn li{padding-bottom:8px;border-bottom:1px solid rgba(21,24,28,.12)}

/* ---------- drawers ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,4,8,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);color:var(--ink);z-index:21;overflow-y:auto;padding:16px 20px 44px;display:grid;gap:14px;align-content:start;box-shadow:-12px 0 32px rgba(0,0,0,.4)}
.drawer h2{font:800 40px/1 var(--font-display);text-transform:uppercase}
.drawer h3{font-size:14px;font-weight:700;color:var(--enamel);margin-top:8px}
.drawer .x{justify-self:end}
.phr{display:grid;gap:0}
.phr li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(21,24,28,.12);font-size:17px}
.say{flex:none;display:inline-flex;align-items:center;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;min-height:38px;font-weight:600;font-size:14px}
.cols{display:flex;flex-wrap:wrap;gap:8px 18px}
.cols li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.cols i{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink)}
.numl{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px 14px;font-size:16px}
.numl li{display:grid;grid-template-columns:30px 1fr;gap:6px}
.numl b{font-variant-numeric:tabular-nums;color:var(--enamel)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.letter{background:#fff;border:1.5px solid rgba(21,24,28,.3);border-radius:8px;min-height:54px;display:grid;place-items:center;align-content:center;color:var(--ink);padding:4px 2px}
.letter:disabled{cursor:default;color:var(--ink)}
.letter b{font-size:19px;line-height:1.1}
.letter small{font-size:11px;color:var(--ink-2);line-height:1.1}
.fs{border:1.5px solid rgba(21,24,28,.2);border-radius:8px;padding:10px 14px 12px;display:grid;gap:6px}
.fs legend{font-weight:700;padding:0 6px}
.radio-l{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:4px 0;cursor:pointer}
.radio-l.dis{opacity:.5;cursor:default}
.ver{font-size:13px;color:var(--ink-2)}

/* ---------- the bang ---------- */
body.boom::after{content:"";position:fixed;inset:0;background:#fff;z-index:50;animation:flash .7s ease-out forwards}
body.boom .rig{animation:shake .14s linear infinite}
@keyframes flash{0%{opacity:0}14%{opacity:1}100%{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= version 3: three languages, two clear roles ================= */
.bar-sel{display:inline-flex;align-items:center;gap:5px;border:1.5px solid currentColor;border-radius:999px;padding:0 4px 0 10px;min-height:40px}
.bar-sel select{background:transparent;border:0;color:inherit;font-weight:600;font-size:14px;padding:6px 2px;cursor:pointer;max-width:112px}
.bar-sel select option{color:#15181C;background:#fff}
.bar-b.ico{display:inline-grid;place-items:center;padding:0;width:40px}
body[data-screen="bomb"] .bar-sel{min-height:36px}
body[data-screen="bomb"] .bar-b.ico{width:36px}
@media (max-width:400px){.bar-sel select{max-width:84px;font-size:13px}}
.sel{padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);min-height:44px;max-width:240px}
.drawer .field{justify-items:start}
.sub{font-size:14.5px;color:var(--ink-2)}

/* start page */
.seg3.langs button{padding:10px 20px;font-size:19px;min-height:52px}
.roles{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 var(--gut) 6px;max-width:1180px}
@media (min-width:760px){.roles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}}

/* a reading aloud can always be stopped: one small button, on screen only while a voice is speaking.
   It sits in the free part of the top bar: on the left on a phone, in the middle on a wide screen. */
#vstop{position:fixed;top:10px;left:var(--gut);z-index:30;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 14px 5px 11px;border-radius:999px;border:2px solid #fff;background:var(--ink);color:#fff;font:600 14px/1.2 var(--font-body);white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}

#vstop:focus-visible{outline:3px solid var(--signal);outline-offset:3px}

@media (max-width:350px){#vstop{padding:5px 9px}#vstop span{display:none}}

.vfail{font-size:14.5px;font-weight:600;color:#A80F26;max-width:60ch}

/* ===== the clock as a decoding puzzle: clues, a time to write, notes beside it, then the pronunciation ===== */
.manual.wide{max-width:1180px}
.man-cols{min-width:0}
.man-cols.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}

  .man-cols.two{grid-template-columns:minmax(0,1fr) clamp(240px,30%,330px);grid-template-areas:"body side" "after side";column-gap:clamp(18px,2.4vw,28px)}
  .man-cols.two>#man-body{grid-area:body}
  .man-cols.two>#man-side{grid-area:side;position:sticky;top:12px;max-height:calc(100vh - var(--side-off,24px));overflow-y:auto}

}
.man-scroll{--side-off:200px}
/* the time to write */
.ck-time{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;width:100%}
.ck-time b{font:800 44px/1 var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums}

.ck-ask{flex:1 1 220px;font-weight:600;font-size:17px;line-height:1.3}
.ck-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;width:100%}
/* the field takes the whole line when the button does not fit beside it */
.ck-row{width:100%;align-items:stretch;flex-wrap:wrap}
.ck-row .slot{flex:1 1 230px;width:0;min-width:0}
.ck-row .pbtn{flex:none}
.hl-row{flex:0 1 auto;min-width:0;flex-wrap:wrap;gap:6px}
.pbtn.sq{min-width:40px;min-height:40px;padding:4px 8px;justify-content:center;font-size:18px;line-height:1}
.ck-fb{display:grid;gap:6px;font-weight:600;font-size:16px;color:var(--signal)}
.ck-words{display:flex;flex-wrap:wrap;gap:6px;color:#fff}

.ck-words .fit{border-style:solid;border-color:#7BE0A0;color:#C4F7D4}
.ck-words i{font-style:normal;font-weight:800}
.ck-ok{font-weight:700;font-size:17px;color:#C4F7D4}
.ck-sent{font-size:28px;line-height:1.5}
.ck-say{width:100%;font-weight:600;font-size:17px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.tbl.clues td:first-child{width:86px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* clock: examples, then the times to write; every word can be tapped for its meaning */
.ck-h{margin:0 0 8px}
.ck-ex{max-width:680px;background:#fff;border:1.5px solid rgba(21,24,28,.2);border-radius:12px;margin:0 0 18px}
.ck-ex li{display:grid;grid-template-columns:5.2ch minmax(0,1fr);gap:18px;align-items:baseline;padding:10px 16px;font-size:20px;line-height:1.4;border-bottom:1px solid rgba(21,24,28,.12)}
.ck-ex.anim li{animation:ckin .4s both}
.ck-ex li:last-child{border-bottom:0}
.ck-ex li{grid-template-columns:30px 5.2ch minmax(0,1fr);gap:14px;align-items:center}
.ck-ex li.step{border-top:6px solid var(--paper-2)}
.ck-ico{width:30px;height:30px;display:block}
.ci-face{fill:#fff;stroke:var(--ink);stroke-width:1.8}
.ci-past{fill:#58CC02;opacity:.85}
.ci-to{fill:#FF9600;opacity:.85}
.ci-hand{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.ci-dot{fill:var(--ink)}
.ck-ex.anim li:nth-child(2){animation-delay:.04s}.ck-ex.anim li:nth-child(3){animation-delay:.08s}.ck-ex.anim li:nth-child(4){animation-delay:.12s}.ck-ex.anim li:nth-child(5){animation-delay:.16s}.ck-ex.anim li:nth-child(6){animation-delay:.2s}.ck-ex.anim li:nth-child(7){animation-delay:.24s}.ck-ex.anim li:nth-child(8){animation-delay:.28s}.ck-ex.anim li:nth-child(9){animation-delay:.32s}
.ck-t{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ck-s{font-weight:500}
.wd{all:unset;display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;cursor:pointer;border-radius:4px;padding:0 1px;background-image:linear-gradient(90deg,currentColor 50%,transparent 0);background-size:6px 2px;background-repeat:repeat-x;background-position:0 1.32em;transition:background-color .15s}
.wd:hover{background-color:rgba(31,77,184,.12)}
.wd:focus-visible{outline:2.5px solid var(--enamel);outline-offset:2px}
.wd.open{background-image:none;cursor:default}
.wd.open:hover{background-color:transparent}
.wd-g{font-size:.66em;font-weight:800;line-height:1.15;color:var(--enamel);white-space:nowrap}
.wd-g.pop{animation:wdpop .42s cubic-bezier(.2,1.6,.4,1) both}
.wd{position:relative}
.wd-pen{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:.7em;font-weight:900;color:#fff;background:var(--bad);border-radius:999px;padding:1px 8px;pointer-events:none;animation:wdpen 1.25s ease-out forwards}
@keyframes wdpen{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1;transform:translate(-50%,-10px)}100%{opacity:0;transform:translate(-50%,-22px)}}
.ck-qs{display:grid;gap:12px;max-width:680px;background:var(--graphite);color:#fff;border-radius:16px;padding:16px 18px}
.ck-qs .wd-g{color:var(--signal)}

.ck-q.pop{animation:ckok .5s cubic-bezier(.2,1.5,.4,1)}
.ck-q.ok .ck-t{color:var(--ok)}
.ck-ans{flex:1 1 200px;font-size:22px;font-weight:600}
.ck-spk{min-width:44px;justify-content:center}
.ck-spk .spk{width:22px;height:22px}

.ck-q.pop .ck-tick{animation:wdpop .45s .1s cubic-bezier(.2,1.6,.4,1) both}
.ck-q.shake{animation:shake .4s}
.ck-fb{font-weight:600;color:var(--signal);margin-top:-4px}
.ck-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.ck-words span{display:inline-flex;gap:5px;align-items:center;border:1.5px solid #FF8A8F;color:#FFC9CB;border-radius:999px;padding:3px 11px;font-weight:600}
.ck-words.pop span{animation:wdpop .3s both}
.ck-words .fit{border-color:#7BE0A0;color:#C4F7D4}

/* ===== the learning path ===== */

@keyframes wdot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-5px)}}

.c0{background:#D8263C}.c1{background:#2F6FE4}.c2{background:#F4C430;color:#3a2a00}.c3{background:#2FA35E}.c4{background:#fff;color:#1b1f2a}.c5{background:#1B1F2A;color:#fff;box-shadow:inset 0 0 0 2px #555}

.pz{font-weight:700;font-size:18px;color:#c7cdd2;align-self:center}
.ltype{width:100%;font-size:17px;padding:9px 12px;min-height:44px}

.panel .tray{max-height:150px;overflow-y:auto}

/* The clock examples are built in steps, each step one idea, around two neighbouring hours A and B:

/* --- word order, Danish --- */
var DA_ORD_STARTER = 'jeg tror, at';

  var mid = sen.adv ? [sen.adv] : neg ? ['ikke'] : [];
  if (base === 'FRONT') return [sen.t, sen.v, sen.s].concat(mid, sen.r, ['.']);
  if (base === 'Q') return [sen.v, sen.s].concat(mid, sen.r, [sen.t, '?']);
  if (base === 'SUB') return [DA_ORD_STARTER, sen.s].concat(mid, [sen.v], sen.r, [sen.t, '.']);

}
function daOrdInstr(type, sen, level) {
  switch (type) {
    case 'FRONT': return level === 1 ? 'Begynd sætningen med »' + sen.t + '«.' : 'Begynd sætningen med tidsudtrykket (det, der svarer på »hvornår?«).';
    case 'Q': return 'Lav sætningen om til et spørgsmål, man kan svare ja eller nej på.';
    case 'NEG': return 'Sæt »ikke« ind i sætningen.';
    case 'FRONT+NEG': return 'Begynd sætningen med tidsudtrykket, og sæt »ikke« ind.';
    case 'Q+NEG': return 'Lav sætningen om til et ja/nej-spørgsmål, og sæt »ikke« ind.';
    case 'SUB': return 'Begynd med »Jeg tror, at …«.';
    case 'SUB+NEG': return 'Begynd med »Jeg tror, at …«, og sæt »ikke« ind.';
  }

}
PACK.da.order = function (r, level, rounds) {
  var plain = DA_ORDS.filter(function (x) { return !x.adv; }), adv = DA_ORDS.filter(function (x) { return x.adv; });
  var types = level === 1 ? ['FRONT', 'Q'] : level === 2 ? ['NEG', 'FRONT', 'Q', 'FRONT+NEG', 'Q+NEG'] : ['SUB', 'SUB+NEG', 'FRONT+NEG', 'Q+NEG'];
  var tl = r.shuffle(types), out = [], usedS = {};

    var type = tl[i % tl.length], sen;
    var pool = type === 'SUB' ? adv : (level >= 2 && type.indexOf('NEG') < 0 && r.chance(0.3)) ? adv : plain;
    do { sen = r.pick(pool); } while (usedS[sen.s + sen.v + sen.t]);
    usedS[sen.s + sen.v + sen.t] = 1;
    var base = [sen.s, sen.v].concat(sen.adv ? [sen.adv] : [], sen.r, [sen.t]);
    var tiles = base.concat(['ikke', DA_ORD_STARTER, '.', '?']);
    var rule = [type.split('+')[0]]; if (type.indexOf('+NEG') > 0) rule.push('NEG');
    out.push({ base: capFirst(base.join(' ')) + '.', type: type, rule: rule, instr: daOrdInstr(type, sen, level), tiles: r.shuffle(tiles), answers: [daOrdAnswer(sen, type)] });
  }

/* --- word order, English --- */
PACK.en.order = function (r, level, rounds) {

    : [['EMB', 0], ['EMB', 1], ['WH', 1], ['NEG', 1]];

  for (var i = 0; i < rounds; i++) {
    var type = kl[i % kl.length][0], isPast = !!kl[i % kl.length][1], needWh = type === 'WH' || type === 'EMB', sen, guard = 0;
    var pool = (isPast ? past : pres).filter(function (x) { return !needWh || x.wh; });
    do { sen = r.pick(pool); guard++; } while (usedB[sen.s + sen.v] && guard < 60);
    usedB[sen.s + sen.v] = 1;
    var fin = isPast ? sen.vp : sen.third ? sen.v3 : sen.v;
    var aux = isPast ? 'did' : sen.third ? 'does' : 'do';

function makeSpec(code) {

  if (/^X:/.test(String(code))) return makePartySpec(code);
  var p = parseCode(code);
  if (!p) return null;
  var P = PACK[p.lang], M = MISSIONS[p.mission - 1];
  var base = hashSeed('lw3:' + p.code);
  var r0 = RU(mulberry32(base));
  var serial = genSerial(r0, P), batteries = r0.int(4);
  var list = M.random ? r0.sample(MODS, M.random) : M.mods;
  var modules = list.map(function (t, i) {
    var rng = mulberry32((base ^ Math.imul(i + 1, 0x9E3779B1)) >>> 0);
    return { t: t, data: GEN[t](RU(rng), p.level, { lang: p.lang, pack: P, serial: serial, batteries: batteries }) };
  });
  var secs = 30; list.forEach(function (t) { secs += MOD_TIME[t]; });
  var time = Math.round(secs * [1, 1.1, 1.2][p.level - 1] / 10) * 10;
  return { code: p.code, lang: p.lang, mission: p.mission, level: p.level, serial: serial, batteries: batteries, modules: modules, time: time, maxStrikes: 3 };
}

  /* what the player with the bomb does, shown under the zoomed task */
  'cap.wires': ['Tell your partner how many wires there are and their colours, from top to bottom. Tap the wire your partner names, then cut it.', 'Mondd el a társadnak, hány drót van és milyen színűek, fentről lefelé. Koppints arra a drótra, amelyet a társad mond, aztán vágd el.', 'Fortæl din makker, hvor mange ledninger der er, og hvilke farver de har, oppefra og ned. Tryk på den ledning, din makker siger, og klip den.'],

  'cap.dict': ['Your partner says a sentence, one word at a time. Type each word and press OK.', 'A társad szavanként mond egy mondatot. Írd be a szavakat egyenként, és nyomd meg az OK-t.', 'Din makker siger en sætning, ét ord ad gangen. Skriv hvert ord, og tryk OK.'],

  'cap.story': ['Read the story aloud. At each gap, your partner helps you find the missing word. Type it and press OK.', 'Olvasd fel a történetet. Minden hiányzó szónál a társad segít megtalálni a szót. Írd be, és nyomd meg az OK-t.', 'Læs historien højt. Ved hvert hul hjælper din makker dig med at finde det manglende ord. Skriv det, og tryk OK.'],

  'cap.lever': ['Read the word aloud. Your partner finds it and tells you which one is right. Press that one.', 'Olvasd fel a szót. A társad megkeresi, és megmondja, melyik a helyes. Azt nyomd meg.', 'Læs ordet højt. Din makker finder det og siger, hvilken der er rigtig. Tryk på den.'],

  'cap.order': ['Read the sentence aloud. Your partner tells you how to change it. Build the new sentence with the tiles.', 'Olvasd fel a mondatot. A társad megmondja, hogyan alakítsd át. Rakd ki az új mondatot a szavakból.', 'Læs sætningen højt. Din makker fortæller, hvordan den skal ændres. Byg den nye sætning med brikkerne.'],

  'h.dict.1': ['Press “Listen” and hear the word. Hold the phone to your ear so that your partner cannot hear it.', 'Nyomd meg a „Meghallgatom” gombot, és hallgasd meg a szót. Tartsd a füledhez a telefont, hogy a társad ne hallja.', 'Tryk på »Lyt«, og hør ordet. Hold telefonen op til øret, så din makker ikke kan høre det.'],
  'h.dict.1b': ['Read the word on the card aloud.', 'Olvasd fel a kártyán lévő szót.', 'Læs ordet på kortet højt.'],
  'h.dict.2': ['Say the word to your partner. Spell it if your partner asks.', 'Mondd el a szót a társadnak. Betűzd, ha kéri.', 'Sig ordet til din makker. Stav det, hvis din makker beder om det.'],
  'h.dict.3': ['When your partner has typed it, press “Next word”.', 'Ha a társad beírta, nyomd meg a „Következő szó” gombot.', 'Når din makker har skrevet det, så tryk på »Næste ord«.'],
  'dict.next': ['Next word', 'Következő szó', 'Næste ord'], 'dict.prev': ['Previous word', 'Előző szó', 'Forrige ord'], 'dict.whole': ['Hear the whole sentence', 'Az egész mondat', 'Hør hele sætningen'],

  'h.pics.1': ['Your partner sees a picture and tells you what it is.', 'A társad lát egy képet, és megmondja, mi az.', 'Din makker ser et billede og siger, hvad det er.'],
  'h.pics.2': ['Tap that word here and listen to its number.', 'Koppints itt arra a szóra, és hallgasd meg a hozzá tartozó számot.', 'Tryk på det ord her, og lyt til dets tal.'],
  'h.pics.2b': ['Find that word here and read its number.', 'Keresd meg itt azt a szót, és olvasd le a számát.', 'Find det ord her, og læs dets tal.'],
  'h.pics.3': ['Tell your partner the number {0}.', 'Mondd meg a társadnak a számot {0}.', 'Sig tallet til din makker {0}.'],
  'pics.words': ['Tap a word to hear its number', 'Koppints egy szóra, hogy halld a számát', 'Tryk på et ord for at høre dets tal'],

  'h.story.1': ['Your partner reads a story aloud. Some words are missing.', 'A társad felolvas egy történetet. Néhány szó hiányzik belőle.', 'Din makker læser en historie højt. Nogle ord mangler.'],
  'h.story.2': ['Find the word in your list that fits the gap, and say it. Three words in the list fit nowhere.', 'Keresd meg a listádban azt a szót, amelyik a hiányzó helyre illik, és mondd meg. Három szó sehova sem illik.', 'Find det ord på din liste, der passer i hullet, og sig det. Tre ord på listen passer ingen steder.'],
  'h.story.3': ['Spell the word if your partner asks. Tap a word to cross it off.', 'Betűzd a szót, ha a társad kéri. Koppints egy szóra, hogy kihúzd.', 'Stav ordet, hvis din makker beder om det. Tryk på et ord for at strege det ud.'],
  'story.bank': ['Your words', 'A te szavaid', 'Dine ord'],
  'story.tr': ['Show the whole story {0}', 'Az egész történet {0}', 'Vis hele historien {0}'], 'story.tr.hide': ['Hide the translation', 'Fordítás elrejtése', 'Skjul oversættelsen'],

  'h.comp.1': ['Read the definition on the card aloud.', 'Olvasd fel a kártyán lévő meghatározást.', 'Læs forklaringen på kortet højt.'],
  'h.comp.2': ['Your partner puts two parts together to make the word. You may guess the word too.', 'A társad két részből rakja össze a szót. Te is tippelhetsz.', 'Din makker sætter to dele sammen til ordet. Du må også gerne gætte.'],
  'h.comp.3': ['When the word is right, press “Next”.', 'Ha jó a szó, nyomd meg a „Következő” gombot.', 'Når ordet er rigtigt, så tryk på »Næste«.'],
  'comp.def': ['Definition', 'Meghatározás', 'Forklaring'],

  'h.lever.1': ['Your partner reads a word aloud.', 'A társad felolvas egy szót.', 'Din makker læser et ord højt.'],
  'h.lever.2.da': ['Find the word in the sentences. Is it an en-word or an et-word? Look at the small words in front of it and at its ending.', 'Keresd meg a szót a mondatokban. „En” vagy „et” szó? Figyeld az előtte álló kis szavakat és a végződését.', 'Find ordet i sætningerne. Er det et en-ord eller et et-ord? Se på de små ord foran og på endelsen.'],
  'h.lever.2.en': ['Find the word in the sentences. Does that sentence use a form of “make” or of “do”?', 'Keresd meg a szót a mondatokban. A „make” vagy a „do” valamelyik alakja áll abban a mondatban?', 'Find ordet i sætningerne. Bruger den sætning en form af »make« eller af »do«?'],
  'h.lever.2.hu': ['Find the word in the sentences. Look at its ending and at the table: which column is it in?', 'Keresd meg a szót a mondatokban. Nézd meg a végződését és a táblázatot: melyik oszlopban van?', 'Find ordet i sætningerne. Se på endelsen og på tabellen: hvilken kolonne står den i?'],
  'h.lever.3': ['Tell your partner which one is right.', 'Mondd meg a társadnak, melyik a helyes.', 'Sig til din makker, hvilken der er rigtig.'],
  'lever.sents': ['Sentences', 'Mondatok', 'Sætninger'], 'lever.table': ['Help', 'Segítség', 'Hjælp'],
  'lever.note.da': ['The ending -en or -et means “the”. Adjectives get -t with et-words. “Den” and “det” can also mean “it”.', 'Az -en vagy -et végződés a határozott névelő („a, az”). Az „et” szavak mellett a melléknév -t végződést kap. A „den” és a „det” magát a szót is helyettesítheti.', 'Endelsen -en eller -et er den bestemte form. Tillægsord får -t ved et-ord. »Den« og »det« kan også stå i stedet for ordet.'],
  'lever.note.en': ['The left column is “make”, the right column is “do”. Whichever form you find in the sentence, the answer is the word at the top of its column.', 'A bal oszlop a „make”, a jobb oszlop a „do” alakjait mutatja. Bármelyik alakot találod a mondatban, a válasz az oszlop tetején álló szó.', 'Venstre kolonne er »make«, højre kolonne er »do«. Uanset hvilken form du finder i sætningen, er svaret ordet øverst i kolonnen.'],
  'lever.note.hu': ['A word always stays in its column. If the sentence says “a postára” or “a postáról”, then the answer to “where?” is “a postán”.', 'Egy szó mindig a saját oszlopában marad. Ha a mondatban „a postára” vagy „a postáról” áll, akkor a „hol?” kérdésre „a postán” a válasz.', 'Et ord bliver altid i sin kolonne. Står der »a postára« eller »a postáról« i sætningen, er svaret på »hvor?« »a postán«.'],

  'h.verbs.1': ['Your partner reads a sentence with a gap, and a verb.', 'A társad felolvas egy hiányos mondatot és egy igét.', 'Din makker læser en sætning med et hul og et verbum.'],
  'h.verbs.2': ['Which form fits? Listen for the signal words. Then find the verb in the table.', 'Melyik alak illik oda? Figyelj a jelzőszavakra. Aztán keresd meg az igét a táblázatban.', 'Hvilken form passer? Lyt efter signalordene. Find så verbet i tabellen.'],
  'h.verbs.3': ['Say the form, and spell it if your partner asks.', 'Mondd meg az alakot, és betűzd, ha a társad kéri.', 'Sig formen, og stav den, hvis din makker beder om det.'],
  'verbs.sig': ['Signal words', 'Jelzőszavak', 'Signalord'], 'verbs.form': ['Form', 'Alak', 'Form'], 'verbs.table': ['Verb table', 'Igetáblázat', 'Verbumstabel'],
  'verbs.note.da': ['Nutid = now, datid = past, førnutid = the form after “har” or “er” (your partner types only the last word), navnemåde = the basic form.', 'Nutid = jelen idő, datid = múlt idő, førnutid = a „har” vagy „er” után álló alak (a társad csak az utolsó szót írja be), navnemåde = főnévi igenév.', 'Ved førnutid skriver din makker kun det sidste ord, ikke »har« eller »er«.'],
  'verbs.note.en': ['The sentences about now always have he, she or it, so the verb needs -s. After have or has, use the 3rd form.', 'A jelen idejű mondatokban mindig he, she vagy it áll, ezért az ige -s végződést kap. A have vagy has után a 3. alak áll.', 'Sætningerne i nutid har altid he, she eller it, så verbet skal have -s. Efter have eller has bruges 3. form.'],
  'verbs.note.hu': ['If the sentence begins with “Én” (I), use an “én” column. Otherwise use an “ő” column (he, she, it). The first column is also the form you find in a dictionary.', 'Ha a mondat „Én”-nel kezdődik, az „én” oszlopot használd. Különben az „ő” oszlopot. Az első oszlop egyben a szótári alak is.', 'Begynder sætningen med »Én« (jeg), så brug en »én«-kolonne. Ellers en »ő«-kolonne (han, hun, den). Den første kolonne er også ordbogsformen.'],

  'h.order.1': ['Your partner reads a sentence aloud.', 'A társad felolvas egy mondatot.', 'Din makker læser en sætning højt.'],
  'h.order.2': ['Read the task on the card to your partner.', 'Olvasd fel a társadnak a kártyán lévő feladatot.', 'Læs opgaven på kortet højt for din makker.'],
  'h.order.3': ['Your partner builds the new sentence from tiles. Help with the rule on the card. Then press “Next”.', 'A társad szavakból kirakja az új mondatot. Segíts a kártyán lévő szabállyal. Aztán nyomd meg a „Következő” gombot.', 'Din makker bygger den nye sætning med brikker. Hjælp med reglen på kortet. Tryk så på »Næste«.'],
  'order.task': ['Task', 'Feladat', 'Opgave'], 'order.rule': ['Rule', 'Szabály', 'Regel'],
  'order.end': ['The last tile is a full stop or a question mark.', 'Az utolsó elem egy pont vagy egy kérdőjel.', 'Den sidste brik er et punktum eller et spørgsmålstegn.'],
  'rule.da.FRONT': ['If the sentence begins with the time, the verb comes second and the subject third.', 'Ha a mondat az időhatározóval kezdődik, az ige a második helyen áll, az alany a harmadikon.', 'Begynder sætningen med tiden, står verbet på plads nummer to og subjektet på plads tre.'],
  'rule.da.Q': ['Yes/no question: the verb comes first.', 'Eldöntendő kérdés: az ige áll elöl.', 'Ja/nej-spørgsmål: verbet står først.'],
  'rule.da.NEG': ['“ikke” comes after the verb and the subject.', 'Az „ikke” az ige és az alany után áll.', '»Ikke« står efter verbet og subjektet.'],
  'rule.da.SUB': ['After “at”, the words ikke, altid and aldrig come before the verb.', 'Az „at” után az ikke, altid, aldrig az ige elé kerül.', 'Efter »at« står ikke, altid og aldrig før verbet.'],
  'rule.en.Q': ['Yes/no question: do or does comes first, then the subject, then the verb in its basic form.', 'Eldöntendő kérdés: elöl a do vagy does áll, utána az alany, majd az ige alapalakja.', 'Ja/nej-spørgsmål: do eller does står først, så subjektet, så verbet i grundform.'],
  'rule.en.NEG': ['Negative: subject, then do or does, then not, then the verb in its basic form.', 'Tagadás: alany, do vagy does, not, majd az ige alapalakja.', 'Nægtelse: subjekt, så do eller does, så not, så verbet i grundform.'],
  'rule.en.WH': ['Question word first, then do, does or did, then the subject and the verb. The part you ask about disappears.', 'Elöl a kérdőszó, utána do, does vagy did, majd az alany és az ige. Az a rész, amire rákérdezel, kimarad.', 'Spørgeordet først, så do, does eller did, så subjektet og verbet. Den del, du spørger om, forsvinder.'],
  'rule.en.ADV': ['always and never stand right before the verb.', 'Az always és a never közvetlenül az ige előtt áll.', 'always og never står lige før verbet.'],
  'rule.en.PAST': ['In the past, questions and negatives use did. The verb goes back to its basic form.', 'Múlt időben kérdésnél és tagadásnál a did áll. Az ige visszakerül alapalakba.', 'I datid bruges did i spørgsmål og nægtelser. Verbet står igen i grundform.'],
  'rule.en.EMB': ['After “Do you know”, there is no do, does or did. The subject comes before the verb.', 'A „Do you know” után nincs do, does vagy did. Az alany az ige előtt áll.', 'Efter »Do you know« bruges do, does og did ikke. Subjektet står før verbet.'],
  'rule.hu.NEG': ['“nem” stands right before the verb.', 'A „nem” közvetlenül az ige előtt áll.', '»nem« står lige foran verbet.'],
  'rule.hu.NINCS': ['nem + van = nincs.', 'nem + van = nincs.', 'nem + van = nincs.'],
  'rule.hu.Q': ['The question word stands right before the verb.', 'A kérdőszó közvetlenül az ige előtt áll.', 'Spørgeordet står lige foran verbet.'],
  'rule.hu.PRE': ['After “nem” or a question word, the first part of the verb (meg, el, fel, be …) moves behind the verb.', 'A „nem” vagy a kérdőszó után az igekötő (meg, el, fel, be …) az ige mögé kerül.', 'Efter »nem« eller et spørgeord flytter forstavelsen (meg, el, fel, be …) om bag verbet.'],
  'rule.hu.FOCUS': ['The word you stress stands right before the verb, and meg, el, fel, ki … moves behind the verb.', 'A hangsúlyos szó közvetlenül az ige előtt áll, az igekötő pedig az ige mögé kerül.', 'Det ord, du lægger vægt på, står lige foran verbet, og meg, el, fel, ki … flytter om bag verbet.'],
  'rule.hu.AUX': ['With akarom, fogom, tudom and kell: meg, el, fel … comes first, then that word, then the form ending in -ni.', 'Az akarom, fogom, tudom, kell mellett: elöl az igekötő, utána a segédige, végül a -ni végű alak.', 'Med akarom, fogom, tudom og kell: meg, el, fel … først, så det ord, så formen på -ni.'],
  'rule.hu.NEGAUX': ['Negative: “nem” stands right before akarom, tudom or kell, and the form ending in -ni is written as one word again.', 'Tagadáskor a „nem” közvetlenül az akarom, tudom, kell elé kerül, a -ni végű alakot pedig újra egybeírjuk.', 'Nægtelse: »nem« står lige foran akarom, tudom eller kell, og formen på -ni skrives igen i ét ord.'],
  'rule.hu.MIT': ['After “mit?”, the verb takes the general form: eszik, vesz (not eszi, veszi).', 'A „mit?” kérdés után általános (alanyi) ragozás áll: eszik, vesz (nem eszi, veszi).', 'Efter »mit?« står verbet i den almindelige form: eszik, vesz (ikke eszi, veszi).'],

  'h.read.1': ['Read the text.', 'Olvasd el a szöveget.', 'Læs teksten.'],
  'h.read.2': ['Your partner reads a question and three answers aloud.', 'A társad felolvas egy kérdést és három választ.', 'Din makker læser et spørgsmål og tre svar højt.'],
  'h.read.3': ['Find the answer in the text and tell your partner. There are three questions.', 'Keresd meg a választ a szövegben, és mondd meg a társadnak. Három kérdés van.', 'Find svaret i teksten, og sig det til din makker. Der er tre spørgsmål.'],
