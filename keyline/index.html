<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700;800&family=Big+Shoulders+Stencil:wght@800;900&display=swap">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --edge:#D5DBE1; --ink:#17202A; --ink-2:#6B7682;
  --A:#2F80ED; --A-deep:#1D5DB5; --A-soft:#E3EEFD;
  --B:#F2994A; --B-deep:#C26A1E; --B-soft:#FDEEDF;
  --me:var(--A); --me-deep:var(--A-deep); --me-soft:var(--A-soft);
  --them:var(--B); --them-soft:var(--B-soft);
  --ok:#22B573; --ok-deep:#15895A; --bad:#FF4B55; --gold:#FFC83D;
  --font:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Big Shoulders Stencil",Impact,"Arial Narrow Bold",sans-serif;
  color-scheme:light;
}
body.tB{--me:var(--B);--me-deep:var(--B-deep);--me-soft:var(--B-soft);--them:var(--A);--them-soft:var(--A-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:620px;width:100%;margin:0 auto}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--edge);border-bottom-width:4px;display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.icon-btn:active{transform:translateY(2px);border-bottom-width:2px}
.icon-btn svg{width:22px;height:22px}
.lang{font-weight:800;font-size:14px;letter-spacing:.04em}
.spacer{flex:1}
.codechip{font-family:var(--display);font-size:20px;letter-spacing:.12em;padding:4px 10px;border-radius:10px;background:var(--card);border:2px solid var(--edge);display:flex;align-items:center;gap:8px}
.link{width:8px;height:8px;border-radius:50%;background:var(--edge)}
.link.on{background:var(--ok);box-shadow:0 0 0 3px #DDF6EA}
main{flex:1;width:100%;max-width:620px;margin:0 auto;padding:0 16px 28px;display:flex;flex-direction:column;gap:14px}

/* home */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:20px 0}
.logo{font-family:var(--display);font-size:clamp(60px,18vw,100px);line-height:.9;margin:0;letter-spacing:.02em}
.logo span{color:var(--A)} .logo em{font-style:normal;color:var(--B)}
.dial{display:flex;gap:10px}
.dial i{width:46px;height:58px;border-radius:12px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--display);font-size:38px;display:grid;place-items:center;border-bottom:5px solid #000;overflow:hidden}
.dial i span{display:block;animation:roll 2.4s cubic-bezier(.5,0,.3,1.3) infinite}
@keyframes roll{0%,70%{transform:translateY(0)}80%{transform:translateY(-130%)}81%{transform:translateY(130%)}100%{transform:translateY(0)}}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;background:var(--ok);color:#fff;border-bottom:5px solid var(--ok-deep);transition:transform .08s}
.big:active{transform:translateY(3px);border-bottom-width:2px}
.big.ghost{background:var(--card);color:var(--ink);border:2px solid var(--edge);border-bottom-width:5px}
.big:disabled{opacity:.4;pointer-events:none}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--edge);background:var(--card);text-align:center;font-family:var(--display);font-size:28px;letter-spacing:.3em;text-transform:uppercase;outline:none}
.join input:focus{border-color:var(--A)}
.join .big{width:64px;flex:none}
.or{color:var(--ink-2);font-weight:700;font-size:14px}

/* team pick */
.bigcode{font-family:var(--display);font-size:clamp(72px,24vw,120px);letter-spacing:.14em;line-height:1;padding-left:.14em;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px;border-radius:20px;color:#fff;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.team.A{background:var(--A);border-bottom:6px solid var(--A-deep)} .team.B{background:var(--B);border-bottom:6px solid var(--B-deep)}
.team:active{transform:translateY(3px);border-bottom-width:3px}
.team svg{width:44px;height:44px}

/* score */
.score{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;background:var(--card);border:2px solid var(--edge)}
.side .sw{width:14px;height:14px;border-radius:5px}
.tok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--edge);transition:transform .4s}
.tok svg{width:16px;height:16px}
.tok.star.on{background:var(--gold);color:#fff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.tok.x.on{background:var(--bad);color:#fff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.round{font-family:var(--display);font-size:22px;color:var(--ink-2)}

/* keywords */
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{position:relative;border-radius:14px;background:var(--me);color:#fff;border-bottom:5px solid var(--me-deep);padding:22px 4px 10px;text-align:center;font-weight:800;text-transform:uppercase;font-size:clamp(11px,3.4vw,17px);letter-spacing:.02em;word-break:break-word;line-height:1.05;animation:deal .5s cubic-bezier(.2,1.4,.4,1) backwards}
.key b{position:absolute;top:4px;left:0;right:0;font-family:var(--display);font-size:16px;opacity:.75}
@keyframes deal{from{transform:translateY(-30px) rotate(-8deg);opacity:0}}

/* the play panel */
.panel{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.panel.them{border-color:var(--them)}
.panel.mine{border-color:var(--me)}
.who{display:flex;align-items:center;gap:8px;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.06em;color:var(--ink-2)}
.who .sw{width:14px;height:14px;border-radius:5px}
.who svg{width:20px;height:20px;flex:none}
.share{background:var(--card);border:3px solid var(--me);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.share .slabel{font-weight:800;font-size:16px;color:var(--ink-2);text-align:center}
.share .bigcode{font-size:clamp(60px,20vw,96px)}
.share .wait{padding:4px 0}
.wlabel{text-align:center;font-weight:800;font-size:17px;color:var(--ink-2);padding-top:6px}
.secret{display:flex;gap:10px;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.secret i{width:58px;height:70px;border-radius:14px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--display);font-size:46px;display:grid;place-items:center;border-bottom:5px solid #000;transition:transform .3s}
.secret.hid i{color:transparent;background:repeating-linear-gradient(45deg,#2A3138 0 6px,#1E2329 6px 12px)}
.secret.hid i::after{content:"?";color:#6B7682;position:absolute}
.secret i{position:relative}
.secret:not(.hid) i{transform:rotateX(360deg)}
.crow{display:flex;align-items:center;gap:10px}
.dig{width:44px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:30px;background:var(--bg);border:2px dashed var(--edge);color:var(--ink)}
.dig.fill{background:var(--me);border:0;border-bottom:4px solid var(--me-deep);color:#fff;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.dig.hid{color:transparent}
.crow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--edge);background:var(--card);padding:0 14px;font-weight:800;font-size:19px;text-transform:uppercase;outline:none}
.crow input:focus{border-color:var(--me)}
.crow input.bad{border-color:var(--bad);animation:shake .4s}
.cw{flex:1;min-width:0;height:52px;border-radius:14px;background:var(--bg);display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:19px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:56px;border-radius:14px;background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;font-family:var(--display);font-size:30px}
.pad button:active{transform:translateY(3px);border-bottom-width:2px}
.pad button:disabled{opacity:.3}
.res{width:44px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#fff;animation:flipin .5s backwards}
.res.ok{background:var(--ok)} .res.no{background:var(--bad)} .res.code{background:var(--ink)} .res.none{background:var(--bg);color:var(--ink-2)}
@keyframes flipin{from{transform:rotateY(90deg)}}
.hdr{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:12px;font-weight:800;color:var(--ink-2)}
.hdr span{width:44px;text-align:center;display:flex;justify-content:center}
.hdr .sw{width:14px;height:14px;border-radius:5px}
.wait{display:flex;justify-content:center;gap:8px;padding:16px 0}
.wait i{width:12px;height:12px;border-radius:50%;background:var(--edge);animation:bob 1.2s infinite}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes bob{40%{transform:translateY(-8px);background:var(--ink-2)}}

/* history */
.hist{display:flex;flex-direction:column;gap:10px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.hcol .h{border-radius:10px;padding:6px 2px;text-align:center;font-weight:800;font-size:12px;text-transform:uppercase;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hgrid.me .h{background:var(--me)} .hgrid.them .h{background:var(--them);font-family:var(--display);font-size:18px;padding:2px}
.hcol .c{border-radius:8px;padding:5px 4px;font-size:12px;font-weight:700;text-transform:uppercase;text-align:center;background:var(--card);border:1px solid var(--edge);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcol .c.new{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

/* end */
.veil{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(23,32,42,.35);z-index:20;animation:fade .25s}
.sheet{width:100%;max-width:620px;background:var(--card);border-radius:24px 24px 0 0;padding:28px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;animation:up .45s cubic-bezier(.2,1.3,.4,1)}
.sheet h2{margin:0;font-family:var(--display);font-size:56px;line-height:1;letter-spacing:.02em}
.sheet.win h2{color:var(--ok)} .sheet.lose h2{color:var(--bad)} .sheet.draw h2{color:var(--ink-2)}
.sheet .big{max-width:340px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;animation:flash .6s forwards}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
body.quake main{animation:shake .45s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;animation:pop .3s}
/* modes */
.modes{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.mode{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--edge);border-bottom-width:6px;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.03em;text-align:left}
.mode:active{transform:translateY(3px);border-bottom-width:3px}
.mode .ic{display:flex;gap:4px;align-items:center;flex:none;width:92px;justify-content:center}
.mode .ic svg{width:28px;height:28px}
.mode .vs{font-family:var(--display);font-size:14px;color:var(--ink-2)}
.pchip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-family:var(--display);font-size:18px}
.side .robot{width:22px;height:22px;color:var(--ink)}
.res .robot,.hdr .robot{width:20px;height:20px}
/* blank pass-the-phone screen */
.cover{position:fixed;inset:0;z-index:50;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cover .n{font-family:var(--display);font-size:160px;line-height:1;animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
.cover svg{width:64px;height:64px;opacity:.6;animation:pass 1s ease-in-out infinite alternate}
@keyframes pass{from{transform:translateX(-14px) rotate(-8deg)}to{transform:translateX(14px) rotate(8deg)}}
.cw.live{color:var(--ink-2)}
.cw.live::after{content:"";width:2px;height:22px;background:var(--me);margin-left:3px;animation:ring 1s infinite}
@keyframes ring{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

};
/* everyday English words that are easy to link to other words */

 'gold silver summer winter night birthday holiday ghost robot dragon castle tower circus zoo hospital church park city').split(' ');

].map(function(f){ var o={}; f.split(' ').forEach(function(w){ o[w]=1; }); return o; });
var ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ', ROUNDS=8, COOP_TURNS=8;
var S = { lang:'en', scr:'home', mode:'', room:'', team:'A', player:'1', ev:[], seen:{}, guess:[], linked:false, shown:'', live:{}, cover:0 };
try{ var sv=JSON.parse(localStorage.getItem('kl-ui')||'{}'); if(sv.lang) S.lang=sv.lang; }catch(e){}
function t(k){ return T[S.lang][k]; }
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function hash(s){ var h=2166136261>>>0; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function rng(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; var x=a; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; }; }

function coop(){ return S.mode!=='vs'; }
function online(){ return S.mode!=='solo'; }
/* every phone builds the same words and codes from the room code */
function makeGame(room){

}
function encoder(turn){ return coop()?'A':(turn%2===0?'A':'B'); }
function opponent(team){ return coop()?'C':(team==='A'?'B':'A'); }
function roundOf(turn){ return coop()?turn+1:Math.floor(turn/2)+1; }

/* ---------- the computer ----------
   It sees only the clues you shared and which number each one belonged to. It also knows the public list of
   possible secret words below, so it works out which word is most likely behind each number, then matches
   today's clues to those words and to the earlier clues. */
var ASSOC={}, FAMOF={};
ASSOC_SRC.split('|').forEach(function(l){ var p=l.split(':'), o={}; p[1].split(' ').forEach(function(w){ o[norm(w)]=1; }); ASSOC[p[0]]=o; });
FAM.forEach(function(g,i){ for(var w in g){ var n=norm(w); (FAMOF[n]=FAMOF[n]||[]).push(i); } });
function norm(w){
  w=String(w); if(w.normalize) w=w.normalize('NFD').replace(/[̀-ͯ]/g,'');
  w=w.toLowerCase().replace(/[^a-z]/g,'');
  if(w.length>4 && /ies$/.test(w)) w=w.slice(0,-3)+'y'; else if(w.length>4 && /(ch|sh|x|s)es$/.test(w)) w=w.slice(0,-2); else if(w.length>3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) w=w.slice(0,-1);
  return w;
}
function variants(c){ var v=[c]; if(c.length>5 && /ing$/.test(c)){ v.push(c.slice(0,-3)); v.push(c.slice(0,-3)+'e'); } if(c.length>4 && /ed$/.test(c)){ v.push(c.slice(0,-2)); v.push(c.slice(0,-1)); } if(c.length>4 && /er$/.test(c)) v.push(c.slice(0,-2)); if(c.length>4 && /y$/.test(c)) v.push(c.slice(0,-1)); return v; }
function famShare(a,b){ var fa=FAMOF[a], fb=FAMOF[b]; if(!fa||!fb) return false; for(var i=0;i<fa.length;i++) if(fb.indexOf(fa[i])>=0) return true; return false; }
/* how strongly a clue points to a possible secret word */
function rel(c,w){
  var best=0, vs=variants(c), A=ASSOC[w]||{};
  for(var i=0;i<vs.length;i++){
    var x=vs[i]; if(!x) continue;
    if(x===w || A[x] || (ASSOC[x] && ASSOC[x][w])) return 1;
    if(x.length>=4 && w.length>=4 && (x.indexOf(w)>=0 || w.indexOf(x)>=0)) best=Math.max(best,.9);
    if(x.length>=5){ var x5=x.slice(0,5); for(var k in A) if(k.length>=5 && k.slice(0,5)===x5){ best=Math.max(best,.8); break; } }
    if(famShare(x,w)) best=Math.max(best,.4);
  }
  return best;
}
/* how close two clues are to each other */
function sim(a,b){
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.length>=4 && b.length>=4 && (a.indexOf(b)>=0 || b.indexOf(a)>=0 || a.slice(0,5)===b.slice(0,5))) return .85;
  if((ASSOC[a] && ASSOC[a][b]) || (ASSOC[b] && ASSOC[b][a])) return .7;
  return famShare(a,b)?.5:0;
}
function aiGuess(turns, i, clues){
  var cols=[[],[],[],[]], N=WORDS.length;
  for(var j=0;j<i;j++){ var tt=turns[j]; if(tt && tt.done && tt.enc==='A') tt.clues.forEach(function(c,k){ cols[+tt.code[k]-1].push(norm(c)); }); }
  var cl=clues.map(norm);
  /* which secret word is behind each number, judged from that number's earlier clues */
  var post=cols.map(function(col){
    if(!col.length) return null;
    var ws=WORDS.map(function(w){ var s=0; col.forEach(function(h){ if(h===w) s-=5; else s+=rel(h,w); }); if(s<0) return 0; var b=.15+s; return b*b*b*b; });
    var z=ws.reduce(function(a,b){ return a+b; },0)||1; return ws.map(function(x){ return x/z; });
  });
  var claim=WORDS.map(function(w,j){ var m=0; post.forEach(function(p){ if(p) m=Math.max(m,p[j]); }); return m; });
  var pri=WORDS.map(function(w,j){ return Math.max(0,1-3*claim[j]); }), pz=pri.reduce(function(a,b){ return a+b; },0)||1;
  pri=pri.map(function(x){ return x/pz; });
  var score=cl.map(function(c){
    var fit=WORDS.map(function(w){ return rel(c,w); });
    return cols.map(function(col,k){
      var P=post[k]||pri, s=0; for(var j=0;j<N;j++) if(fit[j]) s+=P[j]*fit[j];
      var m=0; col.forEach(function(h){ m=Math.max(m,sim(c,h)); });
      s+=.5*m+(col.length?0:.002);
      return Math.round(s*1e6);
    });
  });
  var r=rng(hash('ai:'+S.room+':'+i)), best=null, bs=-1, perms=[];
  [1,2,3,4].forEach(function(a){ [1,2,3,4].forEach(function(b){ [1,2,3,4].forEach(function(c){ if(a!==b&&b!==c&&a!==c) perms.push([a,b,c]); }); }); });
  shuffle(perms,r).forEach(function(p){ var s=score[0][p[0]-1]+score[1][p[1]-1]+score[2][p[2]-1]; if(s>bs){ bs=s; best=p; } });
  return best.join('');
}

/* ---------- the whole game is rebuilt from the list of moves ---------- */
function state(){
  var G=S.game, turns=[], cur=0, st={star:{A:0,B:0,C:0},miss:{A:0,B:0},over:''};
  /* every phone sorts the moves the same way (by time-based id), so all phones agree on the game */
  var evs=S.ev.slice().sort(function(a,b){ return a.id<b.id?-1:(a.id>b.id?1:0); });
  evs.forEach(function(e){
    var tt=turns[e.t]=turns[e.t]||{};
    if(e.k==='clue' && !tt.clues) tt.clues=e.cl;
    else if(e.k==='guess' && !(tt['g'+e.by])){ tt['g'+e.by]=e.g; if(e.cl && !tt.gcl) tt.gcl=e.cl; }
    else if(e.k==='next') tt.next=1;
  });
  turns.forEach(function(tt){ if(tt && !tt.clues && tt.gcl) tt.clues=tt.gcl; });
  for(var i=0;i<1000;i++){
    var tt=turns[i]||{}, E=encoder(i), O=opponent(E);
    tt.code=G.code(i); tt.enc=E; tt.opp=O;
    if(O==='C' && tt.clues && canIntercept(i)) tt.gC=aiGuess(turns,i,tt.clues);
    tt.done=!!(tt.clues && tt['g'+E] && (tt['g'+O] || !canIntercept(i)));
    turns[i]=tt;
    if(tt.done){
      tt.ownOk=tt['g'+E]===tt.code; tt.intOk=canIntercept(i) && tt['g'+O]===tt.code;
      if(!tt.ownOk) st.miss[E]++;
      if(tt.intOk) st.star[O]++;
      if(coop()){
        if(st.star.C>=1){ st.over='C'; cur=i; break; }
      } else if(i%2===1){
        var sc={A:st.star.A-st.miss.A,B:st.star.B-st.miss.B};
        if(st.star.A>=2||st.star.B>=2||st.miss.A>=2||st.miss.B>=2||roundOf(i)>=ROUNDS){ st.over=sc.A>sc.B?'A':(sc.B>sc.A?'B':'draw'); cur=i; break; }
      }
    }
    if(!(tt.done && tt.next)){ cur=i; break; }
  }
  st.turns=turns; st.cur=cur; return st;
}

var RELAY='https://ntfy.sh/', Link={es:null,poll:null,since:0,ids:{}};
function topic(){ return 'keyline-v1-'+hash('kl-link:'+S.mode+S.room).toString(36); }
function store(){ try{ localStorage.setItem('kl-ev-'+S.mode+S.room, JSON.stringify(S.ev)); }catch(e){} }
function post(e, tries){
  if(!online()||typeof fetch!=='function') return; e.dev=DEV; tries=tries||0;
  var url=RELAY+topic(), body=JSON.stringify(e), again=function(){ if(e.k!=='type' && tries<5) setTimeout(function(){ post(e,tries+1); },1500*(tries+1)); };
  try{ fetch(url,{method:'POST',body:body}).then(function(r){ if(!r.ok) again(); }).catch(again); }catch(x){ again(); }
}
function addEv(e){ if(S.seen[e.id]) return false; S.seen[e.id]=1; S.ev.push(e); store(); return true; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
var DEV=(function(){ try{ var d=sessionStorage.getItem('kl-dev'); if(!d){ d=Math.random().toString(36).slice(2,10); sessionStorage.setItem('kl-dev',d); } return d; }catch(e){ return Math.random().toString(36).slice(2,10); } })();

function linkStop(){ if(Link.es){ try{Link.es.close();}catch(e){} } Link.es=null; if(Link.poll) clearInterval(Link.poll); Link.poll=null; S.linked=false; }
function setLinked(){ if(S.linked) return; S.linked=true; var l=$('.link'); if(l) l.classList.add('on'); }
function linkStart(){
  linkStop(); if(!online()) return;
  Link.ids={}; Link.since=Math.floor(Date.now()/1000)-6*3600;
  var url=RELAY+topic(), room=S.room, errs=0;
  function take(m){
    if(!m||S.room!==room) return;
    if(m.event==='open'){ setLinked(); return; }
    if(m.event!=='message'||Link.ids[m.id]) return; Link.ids[m.id]=1;
    if(m.time) Link.since=Math.max(Link.since,m.time);
    var e; try{ e=JSON.parse(m.message); }catch(x){ return; }
    if(!e||e.c!==room||!e.id) return;
    setLinked();
    if(e.dev && e.dev!==DEV && !S.peers[e.dev]){ var first=!Object.keys(S.peers).length; S.peers[e.dev]=1; if(first && S.scr==='play'){ toast(t('joined')); beep('ok'); render(); } }
    if(e.k==='hi') return;
    if(e.k==='again'){ if(S.scr==='play') goPlay(nextRoom(room)); return; }
    if(e.k==='type'){ if(e.by!==S.player && e.t===S.st.cur && Date.now()/1000-(m.time||0)<120){ S.live[e.t]=e.cl; paintLive(); } return; }
    if(addEv(e)) update(true);
  }
  function poll(){ fetch(url+'/json?poll=1&since='+Link.since).then(function(r){ setLinked(); return r.text(); }).then(function(x){ x.split('\n').forEach(function(l){ if(l){ try{take(JSON.parse(l));}catch(e){} } }); }).catch(function(){}); }
  function startPoll(){ if(!Link.poll && typeof fetch==='function'){ poll(); Link.poll=setInterval(poll,2500); } }
  if(typeof EventSource!=='function'){ startPoll(); return; }
  try{ Link.es=new EventSource(url+'/sse?since='+Link.since); }catch(e){ startPoll(); return; }
  Link.es.onopen=setLinked;
  Link.es.onmessage=function(ev){ try{ take(JSON.parse(ev.data)); }catch(e){} };
  Link.es.onerror=function(){ if(++errs>=2 || (Link.es&&Link.es.readyState===2)) startPoll(); };
}

/* ---------- screens ---------- */
function topbar(left){
  return '<div class="top">'+left+'<div class="spacer"></div><button class="icon-btn lang" id="lang" aria-label="Language">'+(S.lang==='en'?'EN':'HU')+'</button></div>';
}
function render(){
  var a=$('#app'), h='', st=S.st;
  document.documentElement.lang=S.lang;
  document.body.classList.toggle('tB', S.team==='B' && S.scr==='play');
  if(S.scr==='home'){
    h=topbar('<a class="icon-btn" href="../" aria-label="'+t('home')+'">'+I.home+'</a>')+
      '<main><div class="hero"><div class="dial"><i><span>3</span></i><i><span style="animation-delay:.2s">1</span></i><i><span style="animation-delay:.4s">4</span></i></div>'+
      '<h1 class="logo"><span>KEY</span><em>LINE</em></h1>'+
      '<div class="modes">'+
        '<button class="mode" data-m="solo"><span class="ic">'+I.phone+'<span class="vs">vs</span>'+I.robot+'</span>'+t('solo')+'</button>'+
        '<button class="mode" data-m="duo"><span class="ic">'+I.phone+I.phone+'<span class="vs">vs</span>'+I.robot+'</span>'+t('duo')+'</button>'+
        '<button class="mode" data-m="vs"><span class="ic"><span class="sw" style="width:22px;height:22px;border-radius:7px;background:var(--A)"></span><span class="vs">vs</span><span class="sw" style="width:22px;height:22px;border-radius:7px;background:var(--B)"></span></span>'+t('vs')+'</button>'+
      '</div></div></main>';
  } else if(S.scr==='room'){
    h=topbar('<button class="icon-btn" id="back" aria-label="Back">'+I.back+'</button>')+
      '<main><div class="hero"><div class="stack"><button class="big" id="new">'+t('newg')+'</button><div class="or">'+t('got')+'</div>'+
      '<div class="join"><input id="jc" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="'+t('code')+'"><button class="big" id="jb" aria-label="'+t('join')+'" disabled>'+I.go+'</button></div></div></div></main>';
  } else if(S.scr==='pick'){
    h=topbar('<button class="icon-btn" id="back" aria-label="Back">'+I.back+'</button>')+
      '<main><div class="hero"><button class="bigcode" id="copy" aria-label="'+t('code')+'">'+S.room+'</button>'+
      '<div class="teams"><button class="team A" data-t="A">'+I.team+t('A')+'</button><button class="team B" data-t="B">'+I.team+t('B')+'</button></div></div></main>';
  } else {
    var G=S.game, cur=st.turns[st.cur];
    h=topbar('<button class="icon-btn" id="back" aria-label="Back">'+I.back+'</button>'+(online()?'<span class="codechip"><span class="link'+(S.linked?' on':'')+'"></span>'+S.room+'</span>':''))+
      '<main>'+shareCard()+scoreBar(st)+keysHtml(G.keys[S.team])+panel(st,cur)+history(st)+'</main>';
  }
  var keep=$$('.crow input').map(function(x){ return x.value; }), fi=$$('.crow input').indexOf(document.activeElement);
  a.innerHTML=h; bind();
  var ins=$$('.crow input'); if(keep.length===ins.length) ins.forEach(function(x,i){ x.value=keep[i]; if(i===fi) x.focus(); });
  if(S.scr==='play' && st.over) showEnd();
}
function shareCard(){
  if(!online() || Object.keys(S.peers||{}).length) return '';
  return '<div class="share"><div class="slabel">'+t(S.mode==='duo'?'shareduo':'sharevs')+'</div><button class="bigcode" id="copy" aria-label="'+t('code')+'">'+S.room+'</button><div class="wait"><i></i><i></i><i></i></div></div>';
}
function getBest(){ try{ return +(localStorage.getItem('kl-best-'+S.mode)||0); }catch(e){ return 0; } }
function scoreBar(st){
  function toks(team, star, miss){
    var h='<div class="side">'+sw(team);
    if(star) h+='<span class="tok star'+(st.star[team]>0?' on':'')+'">'+I.star+'</span><span class="tok star'+(st.star[team]>1?' on':'')+'">'+I.star+'</span>';
    if(miss) h+='<span class="tok x'+(st.miss[team]>0?' on':'')+'">'+I.x+'</span><span class="tok x'+(st.miss[team]>1?' on':'')+'">'+I.x+'</span>';
    return h+'</div>';
  }
  var total=coop()?COOP_TURNS:ROUNDS, now=Math.min(roundOf(st.cur),total);
  if(coop()) return '<div class="score"><div class="side">'+sw('A')+'<span class="round" style="color:var(--ink)">'+st.cur+'</span></div><span class="round">'+I.star.replace('<svg','<svg style="width:18px;height:18px;color:var(--gold);vertical-align:-2px"')+' '+getBest()+'</span><div class="side">'+I.robot+'</div></div>';
  return '<div class="score">'+toks(S.team,true,true)+'<span class="round">'+now+'/'+total+'</span>'+toks(opponent(S.team),true,true)+'</div>';
}
function keysHtml(keys){
  return '<div class="keys">'+keys.map(function(k,i){ return '<div class="key" style="animation-delay:'+(i*.08)+'s"><b>'+(i+1)+'</b>'+esc(k)+'</div>'; }).join('')+'</div>';
}
/* what this screen does right now: give clues, guess, intercept, wait, or see the result */
function roleNow(st,tt){
  if(tt.done) return 'result';
  var mineTeam=tt.enc===S.team;
  if(S.mode==='duo'){
    if(giverOf(st.cur)===S.player) return tt.clues?'wait':'give';
    return tt['gA']?'wait':'guess';
  }
  if(mineTeam){ if(!tt.clues) return 'give'; return tt['g'+S.team]?'wait':'guess'; }
  if(!tt.clues || !canIntercept(st.cur) || tt['g'+S.team]) return 'wait';
  return 'guess';
}
function panel(st,tt){
  var E=tt.enc, mine=E===S.team, role=roleNow(st,tt), P='<div class="panel '+(mine?'mine':'them')+'" data-turn="'+st.cur+'">';
  var waitDots='<div class="wait"><i></i><i></i><i></i></div>';
  if(st.over && !tt.done) return '';
  var who=S.mode==='duo'?'<div class="who"><span class="pchip">'+giverOf(st.cur)+'</span></div>':'<div class="who">'+sw(E)+'</div>';
  if(role==='give'){
    var code=tt.code.split('');
    return P+'<div class="secret">'+code.map(function(d,i){ return '<i style="animation:pop .5s '+(i*.12)+'s cubic-bezier(.2,1.6,.4,1) backwards">'+d+'</i>'; }).join('')+'</div>'+
      code.map(function(d,i){ return '<div class="crow"><span class="dig fill">'+d+'</span><input maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="clue '+(i+1)+'"></div>'; }).join('')+
      '<button class="big" id="send">'+(S.mode==='duo'?t('send'):t('ready'))+'</button></div>';
  }
  if(role==='result'){
    var O=tt.opp, gO=tt['g'+E], gI=tt['g'+O];
    var rows=tt.clues.map(function(c,i){
      var d=tt.code[i];
      return '<div class="crow"><span class="cw">'+esc(c)+'</span>'+
        '<span class="res code" style="animation-delay:'+(i*.15)+'s">'+d+'</span>'+
        '<span class="res '+(gO[i]===d?'ok':'no')+'" style="animation-delay:'+(.45+i*.15)+'s">'+gO[i]+'</span>'+
        (gI?'<span class="res '+(gI[i]===d?'ok':'no')+'" style="animation-delay:'+(.9+i*.15)+'s">'+gI[i]+'</span>':'<span class="res none">–</span>')+'</div>';
    }).join('');
    return P+'<div class="hdr"><span>'+I.eye+'</span><span>'+sw(E)+'</span><span>'+sw(O)+'</span></div>'+rows+(st.over?'<button class="big" id="again2">'+t('again')+'</button>':'<button class="big" id="next">'+t('next')+'</button>')+'</div>';
  }
  var clues=tt.clues||S.live[st.cur]||['','',''], live=!tt.clues;
  if(role==='wait'){
    var name=S.mode==='duo'?t('player').replace('{n}',tt.clues?(giverOf(st.cur)==='1'?'2':'1'):giverOf(st.cur)):(tt.clues?t(opponent(S.team)):t(E));
    var label='<div class="wlabel">'+esc(t(tt.clues?'guessing':'writing').replace('{x}',name))+'</div>';
    waitDots=label+waitDots;
    if(!tt.clues && !(S.mode==='duo' && S.live[st.cur])) return P+who+waitDots+'</div>';
    var myG=tt['g'+(S.mode==='duo'?'A':S.team)]||'';
    return P+who+clues.map(function(c,i){ return '<div class="crow"><span class="cw'+(live?' live':'')+'" data-row="'+i+'">'+esc(c||'')+'</span>'+(myG?'<span class="dig fill">'+myG[i]+'</span>':'')+'</div>'; }).join('')+waitDots+'</div>';
  }
  var g=S.guess;
  return P+who+clues.map(function(c,i){
      return '<div class="crow"><span class="cw'+(live?' live':'')+'" data-row="'+i+'">'+esc(c||'')+'</span><button class="dig'+(g[i]?' fill':'')+'" data-slot="'+i+'">'+(g[i]||'')+'</button></div>'; }).join('')+
    '<div class="pad">'+[1,2,3,4].map(function(n){ return '<button data-n="'+n+'"'+(g.indexOf(String(n))>=0||g.length>=3?' disabled':'')+'>'+n+'</button>'; }).join('')+'</div>'+
    '<button class="big" id="check"'+(g.length===3&&(!live||clues.every(function(c){ return c; }))?'':' disabled')+'>'+t('check')+'</button></div>';
}
function paintLive(){
  var cl=S.live[S.st.cur]||[], rows=$$('.cw[data-row]');
  if(!rows.length){ render(); return; }
  rows.forEach(function(r,i){ if(r.classList.contains('live')) r.textContent=cl[i]||''; });
  var ck=$('#check'); if(ck && rows[0].classList.contains('live')) ck.disabled=!(S.guess.length===3 && [0,1,2].every(function(i){ return cl[i]; }));
}
function history(st){
  function grid(team, mine){
    var cols=[[],[],[],[]];
    st.turns.forEach(function(tt,i){ if(tt.done && tt.enc===team) tt.clues.forEach(function(c,j){ cols[+tt.code[j]-1].push({c:c,n:i===st.cur}); }); });
    return '<div class="hgrid '+(mine?'me':'them')+'">'+cols.map(function(col,k){
      return '<div class="hcol"><div class="h">'+(mine?esc(S.game.keys[team][k]):(k+1))+'</div>'+col.map(function(x){ return '<div class="c'+(x.n?' new':'')+'">'+esc(x.c)+'</div>'; }).join('')+'</div>';
    }).join('')+'</div>';
  }
  return '<div class="hist">'+grid(S.team,true)+(coop()?'':grid(opponent(S.team),false))+'</div>';
}
function bind(){
  var l=$('#lang'); if(l) l.onclick=function(){ S.lang=S.lang==='en'?'hu':'en'; try{localStorage.setItem('kl-ui',JSON.stringify({lang:S.lang}));}catch(e){} render(); };
  var b=$('#back'); if(b) b.onclick=function(){ closeEnd(); linkStop(); if(S.scr==='play') S.scr=S.mode==='solo'?'home':(S.mode==='vs'?'pick':'room'); else if(S.scr==='pick') S.scr='room'; else S.scr='home'; setHash(''); render(); };
  $$('.mode').forEach(function(x){ x.onclick=function(){ beep('tap'); S.mode=x.getAttribute('data-m'); if(S.mode==='solo'){ S.team='A'; goPlay(newRoom()); } else { S.scr='room'; render(); } }; });
  var nw=$('#new'); if(nw) nw.onclick=function(){ beep('tap'); enterRoom(newRoom(),true); };
  var jc=$('#jc'), jb=$('#jb');
  if(jc){
    /* never rewrite the box while typing: phone keyboards lose letters when the text is changed under them */
    var val=function(){ return jc.value.toUpperCase().replace(/[^A-Z]/g,''); };
    jc.oninput=function(){ jb.disabled=val().length!==4; };
    jc.onkeydown=function(e){ if(e.key==='Enter' && val().length===4) jb.click(); };
    jb.onclick=function(){ if(val().length!==4) return; beep('tap'); enterRoom(val(),false); };
  }
  var cp=$('#copy'); if(cp) cp.onclick=function(){ try{ navigator.clipboard.writeText(S.room); toast(t('copied')); }catch(e){} };
  $$('.team').forEach(function(x){ x.onclick=function(){ beep('tap'); S.team=x.getAttribute('data-t'); goPlay(S.room); }; });
  var tm=null;
  $$('.crow input').forEach(function(x,i,all){
    x.oninput=function(){ x.classList.remove('bad');
      if(S.mode==='duo'){ clearTimeout(tm); tm=setTimeout(function(){ var cl=all.map(function(y){ return y.value.trim().toUpperCase(); }), sig=S.st.cur+cl.join('|'); if(sig===S.lastType) return; S.lastType=sig; post({k:'type',t:S.st.cur,by:S.player,cl:cl,c:S.room,id:uid()}); },900); } };
    x.onkeydown=function(e){ if(e.key==='Enter'){ if(all[i+1]) all[i+1].focus(); else sendClues(); } };
  });
  var sd=$('#send'); if(sd) sd.onclick=sendClues;
  $$('.pad button').forEach(function(p){ p.onclick=function(){ if(S.guess.length<3){ S.guess.push(p.getAttribute('data-n')); beep('tap'); render(); } }; });
  $$('button.dig[data-slot]').forEach(function(d){ d.onclick=function(){ var i=+d.getAttribute('data-slot'); if(S.guess[i]){ S.guess=S.guess.slice(0,i); render(); } }; });
  var ck=$('#check'); if(ck) ck.onclick=function(){ if(S.guess.length===3){ var g=S.guess.join(''); S.guess=[]; beep('send'); var ev={k:'guess',t:S.st.cur,by:coop()?'A':S.team,g:g}, tt=S.st.turns[S.st.cur]; if(!tt.clues && S.live[S.st.cur]) ev.cl=S.live[S.st.cur].slice(); act(ev); } };
  var ag=$('#again2'); if(ag) ag.onclick=playAgain;
  var nx=$('#next'); if(nx) nx.onclick=function(){ beep('tap'); act({k:'next',t:S.st.cur}); };
}
function enterRoom(room, made){
  S.room=room;
  if(S.mode==='vs'){ S.scr='pick'; render(); return; }
  S.team='A'; S.player=made?'1':'2'; goPlay(room);
}
function sendClues(){
  var ins=$$('.crow input'), keys=S.game.keys[S.team].map(norm), ok=true, cl=[];
  ins.forEach(function(x){
    var w=x.value.trim().replace(/\s+/g,' ').toUpperCase();
    if(!w || keys.indexOf(norm(w))>=0){ ok=false; x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); }
    cl.push(w);
  });
  if(!ok) return;
  if(document.activeElement) document.activeElement.blur();
  beep('send');
  if(S.mode!=='duo') passPhone();
  act({k:'clue',t:S.st.cur,cl:cl});
}
/* one phone: a blank screen counts down while the phone goes to the teammate */
function passPhone(){
  var c=document.createElement('div'), n=3; c.className='cover';
  function draw(){ c.innerHTML=I.phone+'<div class="n">'+n+'</div>'; beep('tick'); }
  draw(); document.body.appendChild(c); window.scrollTo(0,0);
  var iv=setInterval(function(){ n--; if(n<=0){ clearInterval(iv); c.remove(); var p=$('.panel'); if(p) p.scrollIntoView({block:'center'}); return; } draw(); },1000);
}
/* sounds and effects when something new happens, then redraw */
function update(remote){
  var old=S.st, st=S.st=state();
  if(old && old.cur!==st.cur){ S.guess=[]; S.live={}; }
  if(old){
    var me=coop()?'A':S.team, they=opponent(me);
    var tt=st.turns[old.cur];
    if(tt && tt.done && !(old.turns[old.cur]||{}).done){
      var good=(tt.enc===me?tt.ownOk:!tt.intOk);
      setTimeout(function(){ beep(st.star[me]>old.star[me]?'star':(good?'ok':'no')); if(st.miss[me]>old.miss[me]||st.star[they]>old.star[they]) bump('rgba(255,75,85,.5)'); else if(st.star[me]>old.star[me]) bump('rgba(255,200,61,.6)'); },1400);
    } else if(remote && st.turns[st.cur].clues && !(old.turns[st.cur]||{}).clues) beep('send');
  }
  render();
}
function bump(col){
  var f=document.createElement('div'); f.className='flash'; f.style.background=col; document.body.appendChild(f); setTimeout(function(){ f.remove(); },700);
  document.body.classList.remove('quake'); void document.body.offsetWidth; document.body.classList.add('quake');
  if(navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
}
function goPlay(room){
  closeEnd(); S.endHidden=false; S.endInfo=null; S.lastType=''; S.room=room; S.game=makeGame(room); S.guess=[]; S.live={}; S.st=null;
  try{ S.ev=JSON.parse(localStorage.getItem('kl-ev-'+S.mode+room)||'[]'); }catch(e){ S.ev=[]; }
  S.seen={}; S.ev.forEach(function(e){ S.seen[e.id]=1; });
  S.scr='play'; S.shown='';
  setHash(S.mode+'-'+room+(S.mode==='vs'?'-'+S.team:(S.mode==='duo'?'-'+S.player:'')));
  S.peers={}; S.st=state(); render(); window.scrollTo(0,0); linkStart(); post({k:'hi',c:room,id:uid()});
}
function setHash(h){ try{ history.replaceState(null,'',h?'#'+h:location.pathname); }catch(e){} }

/* ---------- the end ---------- */
function showEnd(){
  var key=S.room+S.st.over; if(S.shown===key){ if(!$('.veil') && !S.endHidden) drawEnd(); return; }
  S.shown=key; setTimeout(drawEnd, 2600);
}
function drawEnd(){
  if(S.scr!=='play'||!S.st.over||$('.veil')) return;
  var o=S.st.over, me=coop()?'A':S.team, res=o==='draw'?'draw':(o===me?'win':'lose'), v=document.createElement('div'); v.className='veil';
  var title=t(res), extra='';
  if(coop()){
    if(!S.endInfo || S.endInfo.key!==S.shown){ var b0=getBest(), sc0=S.st.cur; S.endInfo={key:S.shown,best:b0,nb:sc0>b0}; if(sc0>b0) try{ localStorage.setItem('kl-best-'+S.mode,String(sc0)); }catch(e){} }
    var sc=S.st.cur, best=S.endInfo.best, nb=S.endInfo.nb;
    title=t('cracked'); res=nb?'win':'lose';
    extra='<div class="bigcode" style="font-size:96px">'+sc+'</div><div class="who">'+(nb?t('newbest'):t('best')+': '+best)+'</div>';
  }
  v.innerHTML='<div class="sheet '+res+'"><h2>'+title+'</h2>'+extra+'<button class="big" id="again">'+t('again')+'</button><button class="big ghost" id="look">'+I.eye+'</button></div>';
  document.body.appendChild(v);
  if(res==='win'){ beep('win'); confetti(); }
  $('#again').onclick=playAgain;
  $('#look').onclick=function(){ closeEnd(); S.endHidden=true; render(); if(coop()) return; var them=opponent(S.team); $$('.hgrid.them .h').forEach(function(h,k){ h.textContent=S.game.keys[them][k]; h.style.fontFamily='var(--font)'; h.style.fontSize='12px'; h.style.padding='6px 2px'; }); };
}
function playAgain(){ post({k:'again',c:S.room,id:'a'+uid()}); goPlay(nextRoom(S.room)); }
function closeEnd(){ var v=$('.veil'); if(v) v.remove(); }
function confetti(){
  var c=document.createElement('div'), cols=['#22B573','#FFC83D','#2F80ED','#FF4B55','#F2994A']; c.className='confetti';
  for(var i=0;i<70;i++){ var p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',(Math.random()*160-80)+'px'); p.style.setProperty('--r',(Math.random()*900-450)+'deg');
    p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.4)+'s'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(function(){ c.remove(); },3800);
}
function toast(s){ var d=document.createElement('div'); d.className='toast'; d.textContent=s; document.body.appendChild(d); setTimeout(function(){ d.remove(); },1400); }

/* used by the automated tests */
window.KeylineTest={aiGuess:function(turns,i,clues,room){ S.room=room||"TEST"; return aiGuess(turns,i,clues); },norm:norm,rel:rel};
/* reopen the same game after a reload */
var m=/^#(solo|duo|vs)-([A-Z]{4})(?:-([AB12]))?$/.exec(location.hash||'');
if(m){ S.mode=m[1]; if(m[1]==='vs') S.team=m[3]||'A'; else { S.team='A'; S.player=m[3]||'1'; } goPlay(m[2]); } else render();
})();
</script>
</body>
</html>
